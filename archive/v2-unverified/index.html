<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>戏剧构造实验室 · 进阶创作课程</title>
<meta name="description" content="16节进阶戏剧构造机制课程，以反事实改写、A/B比较和真实作品分析代替入门级选择题。">
<style>
:root{--bg:#0d131c;--nav:#121b28;--surface:#172232;--surface2:#1c2a3b;--surface3:#26384b;--line:#34495d;--ink:#ebeff1;--sub:#aab9c7;--weak:#8295a8;--accent:#edc78c;--blue:#96bad6;--green:#a5d0bd;--danger:#e5a99e;--radius:14px;font-family:Inter,"PingFang SC","Microsoft Yahei",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.8}
button,select,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--blue)}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}.side{background:var(--nav);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.brand{padding:27px 22px 17px;border-bottom:1px solid var(--line);cursor:pointer}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:750;text-transform:uppercase}.brand strong{display:block;font-size:19px;line-height:1.45;margin-top:5px}.brand small{color:var(--sub);font-size:12px}.quick{padding:13px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:9px;padding:9px 13px;font-size:13px;font-weight:650;transition:background .16s,transform .16s}.btn:hover{background:var(--surface3)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}.btn.primary:hover{filter:brightness(1.08)}.btn.ghost{background:transparent}.btn.small{padding:7px 9px;font-size:12px}.btn[disabled]{opacity:.4;cursor:not-allowed}.full{width:100%}.nav-search{margin:12px 14px 0;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:9px;width:calc(100% - 28px);font-size:13px}.side-scroll{overflow-y:auto;flex:1;padding:8px 9px 20px}.group-name{font-size:11px;letter-spacing:.02em;color:var(--weak);margin:18px 12px 6px;font-weight:700}.nav-link{width:100%;display:flex;gap:10px;align-items:center;background:transparent;border:0;padding:9px 11px;text-align:left;color:var(--sub);border-radius:9px;font-size:12px;line-height:1.45}.nav-link:hover,.nav-link.active{background:var(--surface2);color:var(--ink)}.nav-link.active{box-shadow:inset 3px 0 var(--accent)}.number{color:var(--accent);font:700 11px Consolas,monospace}.spacer{flex:1}.nav-done{color:var(--green)}.side-bottom{border-top:1px solid var(--line);padding:12px 16px;color:var(--weak);font-size:11px}
.main{min-width:0}.toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:11px 30px;background:#111b27f2;border-bottom:1px solid var(--line);min-height:61px;gap:8px;backdrop-filter:blur(15px)}.toolbar span{color:var(--sub);font-size:12px}.toolbar-right{display:flex;align-items:center;gap:9px}.content{max-width:1110px;margin:auto;padding:28px 30px 85px}.hero{padding:36px;position:relative;overflow:hidden;background:radial-gradient(circle at 85% 10%,#9c744133,transparent 35%),linear-gradient(120deg,var(--surface),#172435);border:1px solid var(--line);border-radius:18px}.hero:after{content:"戲";position:absolute;right:22px;top:-120px;font-size:350px;color:#ebbd7c10;font-family:serif;pointer-events:none}.hero>*{position:relative;z-index:1}.hero h1{font-size:clamp(29px,4vw,45px);line-height:1.32;margin:12px 0 18px;letter-spacing:.012em}.hero p{color:var(--sub);font-size:16px;max-width:710px}.hero .row{margin-top:22px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.muted{color:var(--sub)}.weak{color:var(--weak)}.tiny{font-size:12px}.small{font-size:13px}.h2{font-size:22px;margin:27px 0 13px;line-height:1.35}.h1{font-size:clamp(26px,3vw,35px);line-height:1.3;margin:8px 0 14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:23px}.card.alt{background:var(--surface2)}.card.emphasis{border-color:#9a7853}.card h2{margin:4px 0 12px;font-size:20px}.card h3{margin:4px 0 8px;font-size:16px}.panel{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:16px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}.lesson-row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:14px 17px;color:var(--ink);margin:8px 0}.lesson-row:hover{background:var(--surface2)}.lesson-row strong{font-size:14px}.lesson-row p{font-size:12px;color:var(--sub);margin:3px 0 0}.metric{font-size:28px;color:var(--accent);font-weight:750;line-height:1.4}.badge{display:inline-flex;align-items:center;border:1px solid #65778a;border-radius:99px;padding:3px 10px;color:var(--sub);font-size:11px;line-height:1.55}.badge.accent{border-color:#ba9460;color:var(--accent)}.badge.success{border-color:#699984;color:var(--green)}.intro{max-width:840px;font-size:16px;color:var(--sub);margin:6px 0 21px}.section{margin-top:17px}.steps{counter-reset:st;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.step{padding:17px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;font-size:13px}.step:before{counter-increment:st;content:"0" counter(st);display:block;color:var(--accent);font:700 12px Consolas,monospace;margin-bottom:9px}.quote{border-left:3px solid var(--accent);padding:7px 14px;background:var(--surface2);border-radius:0 8px 8px 0}.section-label{font-size:11px;color:var(--accent);font-weight:750;letter-spacing:.08em}.lab-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.axis{border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--surface2)}.axis label{display:block;color:var(--accent);font-size:12px;font-weight:700;margin-bottom:6px}.axis select{display:block;width:100%;background:var(--nav);border:1px solid var(--line);padding:9px 11px;color:var(--ink);border-radius:8px;margin-bottom:10px;font-size:13px}.axis p{font-size:12px;color:var(--sub);margin:0;min-height:65px}.flow-svg{display:block;width:100%;height:auto;max-height:185px;background:#10202d;border:1px solid var(--line);border-radius:12px}.flow-svg text{font-family:"Microsoft Yahei","PingFang SC",sans-serif}.hypotheses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.hypothesis{font-size:13px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:13px}.hypothesis strong{color:var(--accent);display:block;font-size:12px}.result{border-left:3px solid var(--green);padding:12px 16px;background:#213329;border-radius:0 11px 11px 0;margin-top:13px}.result p{margin:4px 0;color:var(--sub)}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.snapshot{border:1px solid var(--line);background:var(--surface2);padding:16px;border-radius:11px}.snapshot.empty{border-style:dashed}.snapshot strong{font-size:15px}.snapshot p{margin:6px 0;font-size:13px;color:var(--sub)}.changed{color:var(--accent);font-weight:750}.note{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:14px;color:var(--ink);line-height:1.8}.message{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:13px}.progress{height:7px;background:var(--surface3);border-radius:10px;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:width .2s}.footer{margin-top:38px;border-top:1px solid var(--line);padding-top:16px;color:var(--weak);font-size:12px}.chapter{margin:25px 0 12px}.chapter strong{font-size:16px}.matrix{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.matrix .panel{font-size:12px;padding:12px;min-height:120px}.matrix .panel strong{color:var(--accent);display:block;font-size:12px;margin-bottom:6px}.tabrow{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.tabrow .btn.active{border-color:var(--accent);color:var(--accent)}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.toast{position:fixed;right:22px;bottom:22px;background:var(--surface3);border:1px solid var(--accent);border-radius:10px;padding:11px 16px;z-index:50;font-size:13px;display:none}.toast.on{display:block}.mobile{display:none}
@media(max-width:1100px){.layout{grid-template-columns:255px minmax(0,1fr)}.content{padding:22px}.toolbar{padding:10px 22px}.steps,.lab-controls,.hypotheses{grid-template-columns:1fr 1fr}.matrix{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.layout{display:block}.side{position:fixed;z-index:20;width:min(300px,88vw);transform:translateX(-102%);transition:transform .2s;box-shadow:10px 0 30px #0006}.side.open{transform:translateX(0)}.mobile{display:inline-flex}.content{padding:18px 16px 55px}.toolbar{padding:8px 12px}.hero{padding:24px}.tiles,.tiles.three,.compare,.steps,.lab-controls,.hypotheses,.matrix{grid-template-columns:1fr}.flow-svg{max-height:none}.axis p{min-height:0}.toolbar-right .weak{display:none}}
</style>
</head>
<body>
<div class="layout">
<aside class="side" id="side">
<div class="brand" data-route="#home"><div class="eyebrow">ADVANCED DRAMATURGY</div><strong>戏剧构造实验室</strong><small>机制 · 变形 · 耦合 · 验收</small></div>
<div class="quick"><button class="btn small" data-route="#home">课程总览</button><button class="btn small" data-route="#studio">实验台</button></div>
<input class="nav-search" type="search" id="search" placeholder="搜索技法 / 场景 / 机制" aria-label="搜索课程">
<nav class="side-scroll" id="nav" aria-label="进阶课程导航"></nav>
<div class="side-bottom">仅保存在本机 · 不修改任何剧情仓库</div>
</aside>
<div class="main">
<header class="toolbar"><div class="row"><button class="btn small mobile" id="toggle">☰ 目录</button><span id="crumb">课程总览</span></div><div class="toolbar-right"><span class="weak" id="saved">学习记录仅在本机</span><button class="btn small" id="export">导出记录</button><button class="btn small ghost" id="import">导入</button><input id="importFile" type="file" accept=".json,application/json" hidden></div></header>
<main class="content" id="app"></main>
</div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="./course-data.js"></script>
<script>
(function(){
"use strict";
var D=window.COURSE_DATA||[],KEY="directing-course-advanced-v2";
var P={version:2,axes:{},snapshots:{},notes:{},visited:{}};
try{var saved=JSON.parse(localStorage.getItem(KEY)||"{}");["axes","snapshots","notes","visited"].forEach(function(k){if(saved[k]&&typeof saved[k]==="object")P[k]=saved[k]})}catch(e){}
var app=document.getElementById("app"),nav=document.getElementById("nav"),search=document.getElementById("search");
function enc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));document.getElementById("saved").textContent="已保存至本机"}catch(e){document.getElementById("saved").textContent="请导出备份"}}
function toast(s){var e=document.getElementById("toast");e.textContent=s;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},2400)}
function lesson(id){return D.find(function(x){return x.id===id})}
function done(id){var s=P.snapshots[id]||{};return !!(s.A&&s.B&&String(P.notes[id]||"").trim())}
function progress(){return D.filter(function(d){return done(d.id)}).length}
function axes(d){var a=P.axes[d.id];return Array.isArray(a)&&a.length===3?a:[1,1,1]}
function href(id){location.hash="#lesson/"+id}
function curr(){var b=(location.hash||"#home").split("/");return b[0]==="#lesson"&&lesson(b[1])?lesson(b[1]):null}
function titleArea(t,p){return '<div class="eyebrow">INDEPENDENT CREATIVE PRACTICE</div><h1 class="h1">'+enc(t)+'</h1><p class="intro">'+enc(p)+'</p>'}
function footer(){return '<div class="footer">所有《寻狗记》场景改写均为课堂反事实实验，不自动加入正典。原版24节课程保留在 archive/course-v1.html。理论工具不是强制遵守的创作公式。</div>'}
function button(label,action,klass,extra){return '<button class="btn '+(klass||"")+'" data-action="'+enc(action)+'" '+(extra||"")+'>'+enc(label)+'</button>'}
function renderNav(){var groups=[...new Set(D.map(function(d){return d.group}))],query=search.value.trim().toLowerCase(),c=curr();
nav.innerHTML=groups.map(function(g){var ds=D.filter(function(d){return d.group===g&&(!query||(d.title+d.claim+d.own).toLowerCase().includes(query))});
return ds.length?'<div class="group-name">'+enc(g)+'</div>'+ds.map(function(d){return '<button class="nav-link '+(c&&c.id===d.id?"active":"")+'" data-route="#lesson/'+d.id+'"><span class="number">'+d.id+'</span><span class="spacer">'+enc(d.title)+'</span>'+(done(d.id)?'<span class="nav-done">●</span>':"")+'</button>'}).join(""):""}).join("")}
function home(){var n=progress();return '<section class="hero"><div class="eyebrow">MECHANISMS, NOT BASIC CHECKLISTS</div><h1>不再学习“戏应当是什么”<br><span style="color:var(--accent)">开始研究“戏还能怎样发生”</span></h1><p>16个创作机制，6个能力层级。每节研究构造原理、竞争解释、失效条件，并在同一场景里做反事实 A/B 实验。没有入门选择题，也没有把复杂创作简化成唯一正确答案。</p><div class="row"><span class="badge accent">16 节进阶课</span><span class="badge">48 个可调节实验维度</span><span class="badge">每节 A/B 对照</span><span class="badge">独立于剧情正典</span></div><div class="row">'+button("开始第 01 节","first","primary")+button("打开实验工作台","studio","")+button("课程路线","syllabus","ghost")+'</div></section>'+
'<h2 class="h2">课程进度</h2><div class="tiles three"><div class="card"><div class="metric">'+D.length+'</div><div class="muted small">进阶机制模块</div></div><div class="card"><div class="metric">'+n+'</div><div class="muted small">完成双方案与笔记的模块</div></div><div class="card"><div class="metric">'+Math.round(n/Math.max(1,D.length)*100)+'%</div><div class="muted small">实战训练进度</div><div class="progress"><div style="width:'+Math.round(n/Math.max(1,D.length)*100)+'%"></div></div></div></div>'+
'<h2 class="h2">不再依赖一种戏剧动力</h2><div class="matrix"><div class="panel"><strong>知识差</strong>谁知道什么？何时知道？知道之后还能做什么？</div><div class="panel"><strong>行动约束</strong>什么策略失效？谁承担代价？</div><div class="panel"><strong>时间结构</strong>重复、等待、提前知道与回头重读。</div><div class="panel"><strong>情绪调度</strong>同一个行为如何兼有悲喜？</div><div class="panel"><strong>系统因果</strong>玩家、角色、世界记忆如何保持一致？</div></div>'+
'<h2 class="h2">下一轮建议训练</h2><div class="tiles">'+D.slice(0,4).map(function(d){return '<div class="card"><div class="eyebrow">MODULE '+d.id+'</div><h3>'+enc(d.title)+'</h3><p class="small muted">'+enc(d.claim)+'</p>'+button("进入练习","go:"+d.id,"small")+'</div>'}).join("")+'</div>'+footer()}
function syllabus(){var groups=[...new Set(D.map(function(x){return x.group}))];return titleArea("完整训练路线","入门检查项已从主课移除；每节以构造机制、作品剖析、边界与反事实实验为单位。建议从不熟悉的机制切入，而不是逐一背定义。")+
groups.map(function(g){return '<div class="chapter"><strong>'+enc(g)+'</strong></div>'+D.filter(function(d){return d.group===g}).map(function(d){return '<button class="lesson-row" data-route="#lesson/'+d.id+'"><span class="number">'+d.id+'</span><div class="spacer"><strong>'+enc(d.title)+'</strong><p>'+enc(d.claim)+'</p></div><span class="badge '+(done(d.id)?"success":"")+'">'+(done(d.id)?"已完成":"实验")+'</span></button>'}).join("")}).join("")+footer()}
function excerpt(d){return '<div class="tiles"><section class="card"><div class="section-label">固定的作品事实 / 非正典设计实验</div><p>'+enc(d.own)+'</p></section><section class="card"><div class="section-label">外部作品 · 机制剖析</div><p>'+enc(d.casework)+'</p></section></div>'}
function theory(d){return '<div class="card emphasis"><div class="section-label">精确定义 / DRAMATIC MECHANISM</div><p style="font-size:17px">'+enc(d.claim)+'</p><div class="quote"><div class="section-label">特别注意：不要混淆</div>'+enc(d.not)+'</div></div>'+
'<div class="section card"><h3>构造过程：不是套用公式，而是明确可操作的变量</h3><div class="steps">'+d.steps.map(function(s){return '<div class="step">'+enc(s)+'</div>'}).join("")+'</div></div>'+
'<div class="section">'+excerpt(d)+'</div><div class="section tiles"><section class="panel"><div class="section-label">最容易失效的地方</div><p>'+enc(d.failure)+'</p></section><section class="panel"><div class="section-label">进一步阅读 / 对照作品</div>'+d.refs.map(function(s){return '<p class="small">'+enc(s)+'</p>'}).join("")+'<div class="weak tiny">参考用于交叉阅读；分析是课程构造，不宣称单一解释权。</div></section></div>'}
function flow(d,a){var labels=d.axes.map(function(x,i){return x.choices[a[i]][0]});var x=[128,404,680],w=224;var nodes=labels.map(function(s,i){return '<rect x="'+(x[i]-110)+'" y="32" width="220" height="91" rx="11" fill="#263b4d" stroke="#9f835b"/><text x="'+x[i]+'" y="57" font-size="13" text-anchor="middle" fill="#d8b581">'+enc(d.axes[i].label)+'</text><text x="'+x[i]+'" y="83" font-size="17" text-anchor="middle" fill="#edf3f7">'+enc(s)+'</text>'}).join("");
return '<svg class="flow-svg" viewBox="0 0 810 157" role="img" aria-label="三层机制组合的可调整结构图"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b9a383" stroke-width="1.4"/></marker></defs><path d="M240 76 H288 M516 76 H565" stroke="#b9a383" stroke-width="2" marker-end="url(#arrow)"/>'+nodes+'<text x="405" y="144" font-size="12" fill="#a9bece" text-anchor="middle">组合图是设计假说，不是自动预测观众情绪的计算器</text></svg>'}
function hypotheses(d,a){return '<div class="hypotheses">'+d.axes.map(function(ax,i){return '<div class="hypothesis"><strong>变量 '+(i+1)+' · '+enc(ax.label)+'</strong>'+enc(ax.choices[a[i]][1])+'</div>'}).join("")+'</div>'}
function lab(d){var a=axes(d),shots=P.snapshots[d.id]||{};return '<div class="section card"><div class="row space"><div><div class="eyebrow">COUNTERFACTUAL COMPOSITION LAB</div><h2>构造实验：一次只改变必要变量</h2></div><span class="badge accent">3 × 3 × 3 = 27 种变量组合</span></div><p class="small muted">先固定作品事实，修改下面三项。界面展示的是需要在玩家测试中验证的导演假说，不提供伪精确的“戏剧性分数”。</p>'+
'<div class="lab-controls">'+d.axes.map(function(ax,i){return '<div class="axis"><label for="axis-'+i+'">'+enc(ax.label)+'</label><select id="axis-'+i+'" data-axis="'+i+'">'+ax.choices.map(function(op,j){return '<option value="'+j+'" '+(a[i]===j?"selected":"")+'>'+enc(op[0])+'</option>'}).join("")+'</select><p>'+enc(ax.choices[a[i]][1])+'</p></div>'}).join("")+'</div>'+
'<div class="section">'+flow(d,a)+'</div><div class="section">'+hypotheses(d,a)+'</div><div class="result"><strong>当前机制组合需要检验的命题</strong><p>'+enc(d.interaction)+'</p><p>当前组合：'+d.axes.map(function(ax,i){return enc(ax.choices[a[i]][0])}).join(" → ")+'。请解释三个变量之间是否真的存在因果耦合，而不只是三个好听的名词。</p></div>'+
'<div class="row section">'+button("保存方案 A","saveA:"+d.id,"primary")+button("保存方案 B","saveB:"+d.id,"")+button("回到中间方案","reset:"+d.id,"ghost")+'</div>'+
'<hr class="divider"><div class="row space"><h3>A/B 对照：至少改变一个变量</h3><span class="weak tiny">保存仅写入本机</span></div><div class="compare">'+["A","B"].map(function(k){return snapshotHtml(d,k,shots[k],shots[k==="A"?"B":"A"])}).join("")+'</div>'+
'<div class="message section" id="compareReading">'+comparison(d,shots)+'</div></div>'}
function snapshotHtml(d,k,s,other){if(!s)return '<div class="snapshot empty"><strong>方案 '+k+'</strong><p>尚未保存。调整三项机制变量后保存为 '+k+'，与另一方案进行受控比较。</p></div>';
return '<div class="snapshot"><strong>方案 '+k+'</strong>'+d.axes.map(function(ax,i){var changed=other&&s.axes[i]!==other.axes[i];return '<p><span class="'+(changed?"changed":"")+'">'+enc(ax.label)+'：</span>'+enc(ax.choices[s.axes[i]][0])+(changed?" · 已变化":"")+'</p>'}).join("")+'<p class="weak tiny">保留该方案的构造意图与失败风险；不要只选自己最喜欢的那一版。</p>'+button("载入方案 "+k,"load:"+d.id+":"+k,"small")+'</div>'}
function comparison(d,shots){if(!shots.A||!shots.B)return '比较尚未成立：至少保存一组 A 和一组 B。建议只改变一个轴，先建立因果假说，再测试复合变化。';
var diffs=d.axes.map(function(ax,i){return shots.A.axes[i]!==shots.B.axes[i]?ax.label:null}).filter(Boolean);
if(!diffs.length)return 'A 和 B 三项变量完全一致；此时没有可归因的实验差异。先改动至少一项，再保存。';
return '<strong>差异维度：</strong>'+enc(diffs.join("、"))+'。'+(diffs.length===1?'仅一项发生变化，比较更容易指向该变量；但体验差异仍需盲测。':'同时变化 '+diffs.length+' 项，当前只能比较总体方案，无法将效果归因到单一技法。')+'<p>请写下：A/B 各自可能让玩家首先注意到什么？什么样的观察证据会让你放弃偏爱的方案？</p>'}
function notes(d){return '<div class="section card"><div class="eyebrow">NO MULTIPLE CHOICE · OPEN DESIGN</div><h2>开放式创作挑战</h2><p>'+enc(d.task)+'</p><label class="small muted" for="writing">记录方案推导、失效假说、观察指标。这里不做自动打分。</label><textarea class="note section" id="writing" data-note="'+d.id+'" placeholder="事实边界：&#10;方案 A 的目标与推理：&#10;方案 B 的目标与推理：&#10;可能推翻我判断的证据：">'+enc(P.notes[d.id]||"")+'</textarea><div class="row space"><span class="weak tiny">自动保存在本机；可通过右上角导出。完成标准：A、B 两个方案及一份论证。</span><span class="badge '+(done(d.id)?"success":"")+'">'+(done(d.id)?"已形成完整实验":"尚需比较和论证")+'</span></div></div>'}
function showLesson(d){P.visited[d.id]=true;save();return '<div class="eyebrow">'+enc(d.group)+' · '+d.id+' / 16</div><h1 class="h1">'+enc(d.title)+'</h1><p class="intro">不是记忆概念，而是创造至少两个同样合理、却给观众不同经历的方案，并能解释代价。</p><div class="row"><span class="badge accent">高阶构造</span><span class="badge">机制边界</span><span class="badge">反事实实验</span><span class="badge">A/B 比较</span></div>'+
'<div class="section">'+theory(d)+'</div>'+lab(d)+notes(d)+
'<div class="row section">'+button("上一节","previous:"+d.id,"ghost")+button("下一节","next:"+d.id,"primary")+button("全部课程","syllabus","ghost")+'</div>'+footer()}
function studio(){var completed=progress();var byGroup=[...new Set(D.map(function(x){return x.group}))];return titleArea("实验工作台","从正在创作的场景切入，选择一个此前不常使用的机制。不是自动生成完美剧情，而是做对照实验，训练多路径构造能力。")+
'<div class="card emphasis"><div class="section-label">工作原则</div><div class="steps"><div class="step">先冻结地点、人物身份、事件物理事实和制作边界。</div><div class="step">只选择一个主导机制，定义要改变的知识、行动、时间或关系变量。</div><div class="step">保存A/B反事实方案，写明可能证伪方案偏好的观察证据。</div></div></div>'+
'<div class="section tiles three"><div class="panel"><div class="metric">'+completed+'</div>已完成的模块</div><div class="panel"><div class="metric">'+(D.length-completed)+'</div>待完成机制</div><div class="panel"><div class="metric">'+D.length*27+'</div>可配置的实验变量组合</div></div>'+
'<h2 class="h2">选择你的下一项构造实验</h2>'+byGroup.map(function(g){return '<div class="chapter"><strong>'+enc(g)+'</strong></div><div class="tiles">'+D.filter(function(d){return d.group===g}).map(function(d){return '<div class="panel"><div class="row space"><span class="number">'+d.id+'</span><span class="badge '+(done(d.id)?"success":"")+'">'+(done(d.id)?"已完成":"待实验")+'</span></div><h3>'+enc(d.title)+'</h3><p class="small muted">'+enc(d.task)+'</p>'+button("打开机制实验","go:"+d.id,"small")+'</div>'}).join("")+'</div>'}).join("")+footer()}
function render(){var h=location.hash||"#home",d=curr();app.innerHTML=d?showLesson(d):h==="#studio"?studio():h==="#syllabus"?syllabus():home();
document.getElementById("crumb").textContent=d?"模块 "+d.id+" · "+d.title:h==="#studio"?"实验工作台":h==="#syllabus"?"课程目录":"进阶戏剧构造课程";
renderNav();document.getElementById("side").classList.remove("open");}
document.body.addEventListener("click",function(e){var route=e.target.closest("[data-route]");if(route){location.hash=route.dataset.route;return}
var btn=e.target.closest("[data-action]");if(!btn)return;var s=btn.dataset.action.split(":"),act=s[0],id=s[1],d=lesson(id);
if(act==="first")return href("01");if(act==="studio"){location.hash="#studio";return}if(act==="syllabus"){location.hash="#syllabus";return}
if(act==="go")return href(id);
if(act==="next"||act==="previous"){var i=D.indexOf(d),ix=Math.max(0,Math.min(D.length-1,i+(act==="next"?1:-1)));return href(D[ix].id)}
if(!d)return;
if(act==="reset"){P.axes[id]=[1,1,1];save();render();return}
if(act==="saveA"||act==="saveB"){var k=act==="saveA"?"A":"B";if(!P.snapshots[id])P.snapshots[id]={};P.snapshots[id][k]={axes:axes(d).slice(),savedAt:new Date().toISOString()};save();render();toast("方案 "+k+" 已记录");return}
if(act==="load"){if(P.snapshots[id]&&P.snapshots[id][s[2]]){P.axes[id]=P.snapshots[id][s[2]].axes.slice();save();render()}return}
});
document.body.addEventListener("change",function(e){var n=e.target.closest("[data-axis]");if(n){var d=curr();if(!d)return;var a=axes(d).slice(),i=Number(n.dataset.axis),v=Number(n.value);if(i<0||i>2||v<0||v>2)return;a[i]=v;P.axes[d.id]=a;save();render()}});
document.body.addEventListener("input",function(e){var n=e.target.closest("[data-note]");if(n){P.notes[n.dataset.note]=n.value;save()}});
document.getElementById("toggle").addEventListener("click",function(){document.getElementById("side").classList.toggle("open")});
search.addEventListener("input",renderNav);
document.getElementById("export").addEventListener("click",function(){var data=JSON.stringify({schema:"dramaturgy-advanced-v2",exportedAt:new Date().toISOString(),progress:P},null,2);var b=new Blob([data],{type:"application/json"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download="dramaturgy-course-progress.json";a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)});
document.getElementById("import").addEventListener("click",function(){document.getElementById("importFile").click()});
document.getElementById("importFile").addEventListener("change",function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var v=JSON.parse(r.result);if(v.schema!=="dramaturgy-advanced-v2"||!v.progress||!v.progress.axes||!v.progress.notes||!v.progress.snapshots)throw Error("不兼容的备份");P=v.progress;save();render();toast("进度导入完成")}catch(ex){toast("导入失败："+ex.message)}};r.readAsText(file)});
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
render();
})();
</script>

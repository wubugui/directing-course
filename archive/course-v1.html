<script type="application/json" id="lessonData">[{"id":"01","group":"A 剧作与人物","name":"场景中的戏剧动作","mins":16,"objective":"不用公式生成剧情，而是看清现有场景为什么有效。","theory":"一场戏至少有一个可观察的变化：人物的处境、相互关系、实际行动或玩家的认识。变化不必是反转，也可能只是信任增加一点。把场景拆成“目标—阻力—行动—结果”，相当于给已有剧情做结构诊断，而不是逼自己按四步写戏。","steps":["人物此刻想得到什么","具体阻力由谁或什么产生","他究竟做了什么，不只是说了什么","场面结束后局面改变了多少"],"own":{"scene":"崖墓尸任务发布Cutscene","state":"已落地·精调演出","detail":"关二狗警惕深夜背尸，却想从雇主身上套钱。报出五百文，他迅速变脸；拿到定钱，他又盘算不去上山。接活的剧情信息与贪财、怕死、嘴硬的性格同时完成。","learning":"不是因为“接到了任务”才有戏，而是人当场改变了行动策略。"},"outside":{"name":"《十二怒汉》","detail":"一间陪审室里，陪审员看似只是在讨论同一份证据，实际在争夺谁有资格认定事实，以及怎样承担判决的责任。说服的每一步都改变房间里的人际关系。","learning":"极少换场景也能持续有戏，关键是每轮行动让局势改变。"},"decision":"当场景像任务说明书：先标出谁做了什么导致谁改变主意，再考虑删对白。","pitfall":"不要要求每一个日常小场景都完成巨大价值反转。","task":"给崖墓发活戏划出“骂人→改口”“讨价→答应”“装答应→决定骗钱”三个小转折，判断哪一个最需要被观众看见。","patterns":["加一段背景解释，说明夜活为何危险","保留谈钱的行为变化，让接活同时揭示人物","为雇主增加一个毫无根据的惊天身份"],"questions":[{"prompt":"场景的核心戏剧动作是什么？","options":["交代牛头凼在哪里","关二狗在风险和高额报酬之间改变策略","把禁忌完整念给玩家"],"correct":1,"why":"地名和禁忌是信息；人物行动策略改变，才产生戏剧动作。"},{"prompt":"原版看起来像任务公告，应先检查什么？","options":["是否有角色的欲望、阻力与行动","立刻把镜头缩到1.8倍","把台词换成文言文"],"correct":0,"why":"先检查戏剧关系，不要用包装替代冲突。"},{"prompt":"一场看似平淡的街头日常能留下吗？","options":["不能，必须有反转","可以，只要它承担真实的关系、生活或期待功能","必须加入一具尸体"],"correct":1,"why":"微小关系变化也是场景功能。"},{"prompt":"《十二怒汉》证明什么？","options":["只有封闭空间才适合对话戏","冲突必须靠吼叫","有限空间中持续变化的说服关系也能形成强戏"],"correct":2,"why":"导演把新的行动与关系变化组织在同一场地。"}],"ref":["scriptnotes","pixar","mckee"]},{"id":"02","group":"A 剧作与人物","name":"复杂人物与多重动机","mins":18,"objective":"理解人物的矛盾，不给矛盾强行找唯一根因。","theory":"人物能同时想活、想停止受苦；能救人、也会逃跑。区分四层：可见行为、角色自我解释、作者知道的事实、玩家自己的判断。四层不必一致。所谓人物复杂，不是把两个相反标签简单相加，而是让它们在具体代价下各自真实。","steps":["先记录具体行为","辨认人物自己相信的理由","保留独立的、可能冲突的欲望","允许玩家形成不同判断"],"own":{"scene":"阿秀十年前的逃亡与山口","state":"最新正典·未实机落地","detail":"她能识布、雇鬼、讨回鬼客工钱；但深潭的存在把老鬼从没有洞的地面拖走，她只能弃铺逃跑。后来她又选择回村示警，而且仍盘算喊完人再逃。她的自我憎恶和对生活的珍惜可以都是真的。","learning":"观众不必因为她怕死而否定本事，也不必因为她回头而认定她从来没怕过。"},"outside":{"name":"《小偷家族》","detail":"家庭内部有亲密与照顾，也有利用、隐瞒和违法行动。作品没有用某个单一揭晓，否认其中全部真情。","learning":"观众可以同时保留不同尺度的事实、情感和道德评价。"},"decision":"当人物被总结成一句人设标签时，问：在哪个行动中，两种欲望同时让他付出了代价？","pitfall":"不要用“其实她早就想死”取消她珍惜生活的真实性。","task":"把阿秀的“挣钱、爱美、怕死、舍不得桃溪、厌恶自己的逃跑”分成独立事实，不要排列成善恶分数表。","patterns":["让隐藏求死念头解释一切","保留多种真实动机与未完全自知的矛盾","让NPC宣布她究竟善还是恶"],"questions":[{"prompt":"阿秀的求死念头最适合承担什么？","options":["最后对她一生行为的唯一解释","增加对她处境的理解，同时保留真实求生欲","证明她回村不是为了报警"],"correct":1,"why":"新增心理线索不能吞掉全部此前事实。"},{"prompt":"她把逃亡看成懦弱，玩家必须同意吗？","options":["不必，人物自我判断不是全知判词","必须，否则玩家不懂人物","只要设置隐藏成就就必须同意"],"correct":0,"why":"自我评价和实际危险可以形成复杂关系。"},{"prompt":"如何把复杂性写成戏？","options":["给人物三条互相矛盾的设定","让旁白总结矛盾","让不同欲望对一个具体行动产生相反牵引"],"correct":2,"why":"人物复杂性要被行为承担，不能只停留在设定文本。"},{"prompt":"《小偷家族》的亲情与责任关系说明？","options":["亲密就会自动洗去责任","真实情感与问题行为可以同时成立","法律评价能够概括人物全部"],"correct":1,"why":"两组事实不能相互抹掉。"}],"ref":["toolbox","mckee"]},{"id":"03","group":"A 剧作与人物","name":"对白与潜台词","mins":16,"objective":"判断人物说话时到底在做什么。","theory":"对白的字面内容只是表层。人物经常是在试探、请求、遮掩、嘲笑、讨好、抢占主动权；这便是台词的动作。潜台词不等于所有人说反话，尤其底层人物可能极其直白。真正要看语言如何改变对方的行为。","steps":["字面说了什么","说话者想对对方施加什么影响","对方如何回应","两人关系是否随之变化"],"own":{"scene":"茶馆斗嘴Cutscene","state":"已落地·精调演出","detail":"关二狗嘲笑瞎子李“是不是遭反噬才瞎”，瞎子李叫他靠近，识破他的尸臭；取笑者被识破，随后小二逃开、掌柜赶人。语言与空间行为一起改变了场面的主动权。","learning":"“你娃过来一点”不仅是指示走位，也是让挑衅者进入对方的掌控范围。"},"outside":{"name":"《步履不停》","detail":"一家人聚餐、做饭、闲谈，表层只是问候和日常安排；对亡子的记忆与亲人期待，却藏在谁做什么、谁回避什么、谁重复旧话里。","learning":"潜台词也可以被家务动作和未出口的话承载。"},"decision":"对白卡住时，将“这句话说明了什么信息”改问“他此刻希望对方做什么”。","pitfall":"不要把所有角色都写成口是心非的谜语人。","task":"拿“官爷嗦，黑我一跳”做两次表演分析：一次是真正吓到，一次是借官爷称呼求饶或讨好；不改字面对白。","patterns":["给人物补五句心理独白","保留台词，改变走位或反应来测试意图","把每句台词都写成隐喻"],"questions":[{"prompt":"“晚上的活路，价钱和白天不一样”在做什么？","options":["仅介绍雾津经济制度","一边试探报价，一边避免直接承认害怕","说明游戏时钟机制"],"correct":1,"why":"角色有明确的社会行动意图。"},{"prompt":"对白过于像设定说明书，先检查？","options":["角色是不是在争取、隐瞒、试探或拒绝什么","再加详细百科","统一加诗意修辞"],"correct":0,"why":"台词能产生行为，才容易自然。"},{"prompt":"瞎子李叫二狗靠近，发生什么？","options":["只换了两人的站位","没有任何关系变化","把对方的取笑转变成自己揭穿对方的机会"],"correct":2,"why":"台词行动与走位合成了权力转换。"},{"prompt":"潜台词一定需要说反话吗？","options":["需要，否则不是潜台词","不需要，直白话也能承载复杂行动意图","需要附一段旁白翻译"],"correct":1,"why":"潜台词是行动目标与关系，不是“每句话反着听”。"}],"ref":["pixar","toolbox","mckee"]},{"id":"04","group":"B 视听导演","name":"走位、群戏与空间权力","mins":18,"objective":"让人物站在哪里、怎样靠近，成为故事的一部分。","theory":"Blocking（演员调度）包括位置、运动轨迹、速度、朝向、人与人之间的距离。Staging进一步决定谁是画面的主要动作、谁是反应者、哪些背景人物继续生活。走位没有固定词典：靠近可以是讨好、威胁、认清，也可以只是听清。","steps":["先确定主动作","分配反应者和背景活动","设计有意图的位置变化","保证观众知道谁在哪里"],"own":{"scene":"茶馆小二逃开、掌柜赶人","state":"已落地·精调Cutscene","detail":"小二听说关二狗摸过死人后跳开，二狗故意追过去，小二逃，掌柜加入驱赶。舞台上多个人动，但动作都围绕一个焦点：二狗故意吓唬小二。","learning":"当掌柜加入时，笑话的社会压力扩大；同一个空间产生了新的权力结构。"},"outside":{"name":"《玩乐时间》","detail":"雅克·塔蒂的餐厅长段群戏里，多组人物与事故同时发生。观众不用每秒看向同一角色，依然能通过走位、声音和构图识别喜剧焦点。","learning":"背景生活不是装饰；它能让场所像真正运转的社会。"},"decision":"多人场景混乱时，暂时关掉其他动作，只留主动作与一个反应者，逐个恢复。","pitfall":"不要为让画面更动感而让所有NPC同时跑动。","task":"冻结茶馆“关二狗追小二”一拍，分别标明主要冲突、即将介入的掌柜、无须抢戏的茶客。","patterns":["把每个NPC都设为跑动","先建立焦点与空间层级，再增加动作","不停切换机位隐藏空间问题"],"questions":[{"prompt":"小二和掌柜同时移动，先检查？","options":["是否大家速度相同","观众该看谁，次要动作是否支持他","能否再加一个过场"],"correct":1,"why":"主动作和反应动作需要层次。"},{"prompt":"二狗向官差靠近，含义必然是什么？","options":["不必然，结合速度、姿态、台词与社会背景判断","一定是威胁","一定是亲密"],"correct":0,"why":"走位意义依赖上下文。"},{"prompt":"多人对话频繁切镜，观众不知道角色相对位置，应该？","options":["再加UI箭头","加大量字幕","建立清晰空间关系，减少无目的切换"],"correct":2,"why":"先保空间可读性，再谈镜头花样。"},{"prompt":"《玩乐时间》提供什么经验？","options":["群演都不能动","背景行为能构建生活感，但仍需组织观众注意力","所有喜剧必须拍特写"],"correct":1,"why":"空间叙事需要主次和层级。"}],"ref":["pixar","filmgram"]},{"id":"05","group":"B 视听导演","name":"机位、构图与视觉注意力","mins":18,"objective":"在等距视角下掌握“给观众看什么”的决策。","theory":"镜头要回答三个问题：谁重要；哪些背景关系必须保留；哪些信息现在不应成为焦点。景别、构图、运动、角色朝向和镜头持续时间都在协作。电影的180度轴线能帮助维持空间连续性，但固定等距游戏不必机械照搬正反打。","steps":["定义这一拍的注意对象","决定需要多少环境上下文","确定镜头移动或保持","回看有没有抢戏的信息"],"own":{"scene":"崖墓发布Cutscene首镜","state":"已落地·精调Cutscene","detail":"实际开场并行移动镜头中心、缩放至1.5。报价“五百文”时可以测试保持双人关系景，或强调关二狗的反应；不能仅凭专业术语认定某种机位更好。","learning":"如果要让笑点来自“他变脸有多快”，提前特写钱袋未必有利。"},"outside":{"name":"《红海龟》","detail":"动画几乎没有对白；人物经常与沙滩、海面、悬崖共处于大的画面中。人物与环境的尺度变化承担了孤独、危险和联系的表达。","learning":"近景不总是更有感情；空间尺度也能直接表达处境。"},"decision":"镜头拿不准，分别制作“环境关系”“人物反应”“物件信息”三个草图，写下玩家首先注意什么。","pitfall":"避免为了看起来电影化，频繁打断玩家的方向感。","task":"针对“五百文”做三个纸面取景方案，只改注意力焦点，不改台词。","patterns":["焦点放雇主与二狗的关系","焦点放二狗听到报价的瞬间反应","焦点放尚未给出的全部报酬"],"questions":[{"prompt":"想强调“关二狗迅速变脸”，优先测试？","options":["收远景只看巷道全貌","使二狗反应在画面中显著","提前播放结局音乐"],"correct":1,"why":"镜头先服务这一拍的心理观察任务。"},{"prompt":"等距游戏需要对180度规则怎样理解？","options":["作为空间可读性的参考，而非机械镜头禁令","绝对不需要任何方向连续性","每条台词必须反打"],"correct":0,"why":"基本目的是维持空间关系和观察连续性。"},{"prompt":"表现人物在环境面前很渺小，常见方法？","options":["无论何时都切近景","把人物字幕加到最大","保留人物与广阔环境的尺寸对照"],"correct":2,"why":"尺度本身可以表达世界对人物的压力。"},{"prompt":"镜头很漂亮但玩家错过了关键动作？","options":["漂亮最重要","优先恢复关键动作的可见性和注意力层级","用旁白重复解释即可"],"correct":1,"why":"镜头的传达功能先于纯装饰。"}],"ref":["pixar","filmgram"]},{"id":"06","group":"B 视听导演","name":"表演、微动作与反应","mins":18,"objective":"把“表现情绪”转化为演员能执行的动作。","theory":"“表现出害怕”太抽象；“想装作不怕，却悄悄离危险远一点”是可执行的行动意图。角色不必每句话都有新动画。反应延迟、停手、眼神方向和对道具的处理，往往更重要。","steps":["角色当下要做的事","哪个具体动作支持它","反应何时发生","观众能否推断动机"],"own":{"scene":"崖墓任务发布数钱段","state":"已落地·精调Cutscene","detail":"关二狗嘴硬说根本不去，又蹲下数定钱，发现一枚是私铸钱还是算进去。动作不需要解释“他很贪财”，他的行为已经把这种欲望演出来。","learning":"二狗的可笑与真实来自具体小动作，而非始终播放“贪财”的夸张动画。"},"outside":{"name":"《佛罗里达乐园》","detail":"儿童通过跑闹、探索与调皮度日；成年人则通过工作、照料和疲惫动作回应相同的环境。看似细碎的生活行为不断暴露角色处境。","learning":"从人物眼中的当下行动出发，比替角色宣布情绪更自然。"},"decision":"角色念台词像木偶：给其一个动作任务，再看声音、姿态和镜头是否足够。","pitfall":"不要为显得演技丰富而堆满无意义的小动作；停手也可以表达。","task":"让“官爷嗦，黑我一跳”有两套不改文字的微表演：一种真被吓，一种借机讨好。","patterns":["临场给人物多加三个感叹号","通过具体目的和可见动作改变台词含义","把心理分析写进字幕"],"questions":[{"prompt":"哪句导演指令更容易落实？","options":["再复杂一点","听见要价后先看钱袋，再看雇主","提升情感浓度"],"correct":1,"why":"可执行、可观察的行为优于抽象情绪。"},{"prompt":"“算你一个”为什么塑造人物？","options":["行为表现了他与钱的真实关系","因为所有货币都必须可用","因为一句台词天生有潜台词"],"correct":0,"why":"贪财通过选择表现而非被标签化。"},{"prompt":"游戏资源做不出微妙面部表情，优先利用？","options":["无限增加立绘切换","更长的解释台词","动作顺序、停顿、位置与声音"],"correct":2,"why":"动作与时间可以代替部分高成本表演。"},{"prompt":"角色动作很多但显得浮夸，应该？","options":["动作越多越好","保留最能表达行动意图的动作，清理噪声","增加更多表情图标"],"correct":1,"why":"有意义的少量动作通常胜过密集表演。"}],"ref":["pixar","filmgram"]},{"id":"07","group":"B 视听导演","name":"剪辑、节奏与时间跳跃","mins":18,"objective":"从“快一点/慢一点”的直觉上升到可验证的节奏诊断。","theory":"节奏来自期待的产生、信息到来、反应被看见以及预期兑现。停顿既可能留出观察时间，也可能制造滑稽或不安；缺少变化的等待才容易显得拖沓。测试节奏时尽量只变一个参数，完整播放前后动作。","steps":["建立观众预期","留出观察或等待","安排关键动作的时机","检查兑现与余韵"],"own":{"scene":"崖墓任务发布“半个时辰后”","state":"已落地·精调Cutscene","detail":"关二狗蹲下，演出里有2秒明确等待；随后开始数钱，黑屏并显示“半个时辰后”，回来他还在数。时间跳跃把一种滑稽行为放大为人物性格。","learning":"笑点不只在他数错钱，而在“他竟愿意为这点钱反复耗这么久”。"},"outside":{"name":"《一尸到底》","detail":"开场用持续的长镜头组织多名演员、空间移动和事故。值得注意的不是技术炫技，而是观众一直在等下一步会出什么问题。","learning":"一个镜头长不等于无聊；它内部必须持续提供可追踪的行动与期待。"},"decision":"笑点不响，分开检查铺垫、观看反应的机会、停顿长度和兑现顺序。","pitfall":"不要凭“玩家没有耐心”就统一缩短所有演出等待。","task":"只把数钱前的等待设成0.8、2、3秒做A/B/C，其他动作与声音暂不变。","patterns":["只缩短等待","保留或微调等待，让观众先看见角色对钱的迫切","不断增加台词解释笑点"],"questions":[{"prompt":"“半个时辰后他还在数钱”主要靠什么？","options":["纯靠摄影技术","时间省略与重复行为的意外持续","背景音乐突然升高"],"correct":1,"why":"时间跳跃重新赋予了前一个动作荒谬的长度。"},{"prompt":"将2秒减成0.2秒一定更好吗？","options":["不一定；要看是否失去预期与观察","一定，越快越有趣","一定，因为游戏不能有空白"],"correct":0,"why":"时间是一项需要在完整表演中测试的变量。"},{"prompt":"玩家不笑时，先判断？","options":["是不是要增加第二个笑话","是不是分辨率太低","是铺垫不足、反应被遮住，还是兑现时机错"],"correct":2,"why":"按失效环节定位节奏问题。"},{"prompt":"长镜头仍然有效的条件是？","options":["镜头不切就必然高级","内部持续存在可理解的行动与新的期待","演员动作越少越好"],"correct":1,"why":"镜头长度不是节奏的全部。"}],"ref":["pixar","filmgram"]},{"id":"08","group":"C 游戏与环境","name":"声音、静默与恐怖调度","mins":19,"objective":"用环境声音控制空间认知，而不是只调大惊吓音量。","theory":"声音有来源、距离、方向、频谱、重复规律。可怕的不仅是突然响起，更是玩家建立了“这里通常怎样响”的认知以后，规律突然改变。恐怖导演要同时考虑玩家在画面外能推断什么。","steps":["先建立正常声场","制造可辨认的偏离","给玩家观察和推断机会","决定揭露或继续保留未知"],"own":{"scene":"跑马梁去程夜风逐段变弱","state":"前段配置已落地·部分音频待资源","detail":"设计记录中二段夜风0.6、三段0.18，墓内趋于静默；猿啼等音频素材尚未全部接入。这种组织是在用声音衰减告诉玩家环境越来越不正常。","learning":"如果没有先让玩家听惯山风，后面的静未必具备可被察觉的意义。"},"outside":{"name":"《窃听大阴谋》","detail":"主人公不断重听录音。相同声音片段在不同时刻改变他的理解，听觉证据和误解构成整部片的核心戏剧。","learning":"声音不仅制造气氛，还能成为不可靠但可被调查的事件信息。"},"decision":"恐怖不够，先问玩家能否判断声音来自哪里、为何改变，而非直接增加音量。","pitfall":"持续的低频轰鸣和反复跳脸很容易使玩家习惯乃至疲劳。","task":"为“到墓候更”设计三种声音曲线：逐渐减弱、突然消失、稳定背景后出现一个不合规律的声音。","patterns":["一进山就完全静音","先建立声音常态，再让它改变","所有声音全程最大音量"],"questions":[{"prompt":"夜风越走越弱，什么时候更有用？","options":["玩家已经认识到此前有稳定风声","每次进入游戏一开始就静音","只要风声很小就足够"],"correct":0,"why":"恐怖来自玩家可以觉察的规律变化。"},{"prompt":"听见身后脚步却看不到人，构成什么？","options":["直接证明鬼的身份","画外空间与信息不确定","必须立刻跳脸"],"correct":1,"why":"听觉把信息扩展到画框外。"},{"prompt":"恐怖段声音很乱，优先做什么？","options":["继续叠加声效","让所有环境音强度相同","区分前景线索和背景噪声的注意层级"],"correct":2,"why":"声音与画面一样需要主次。"},{"prompt":"《窃听大阴谋》提醒我们声音能做什么？","options":["只能装饰氛围","成为人物误读与重新理解事件的证据","每段声音都必须有准确字幕"],"correct":1,"why":"听觉证据本身可以推进叙事。"}],"ref":["pixar"]},{"id":"09","group":"C 游戏与环境","name":"道具与环境叙事","mins":18,"objective":"让一件物品先作为生活事实存在，再可能形成情感与调查意义。","theory":"环境叙事不等于到处摆设定文档。物件的磨损、摆放、缺失和重复使用可以让玩家推断“谁在此生活、发生过什么”。最好的证据还要适应玩法：查看、拿取、归还、对比或误认。","steps":["对象先有实用角色","留下使用者习惯","允许玩家自行推断","必要时才改变物件的意义"],"own":{"scene":"跑马梁神龛与阿秀遗物","state":"神龛已验收；阿秀旧铺为设计稿","detail":"神龛已允许两种钱真实供奉。阿秀遗物里的空香粉盒、零线、铜纽子和没缝完的衣裳尚属于后续叙事线索，它们首先证明她真实生活过，不应全部强制变成大结局钥匙。","learning":"“生活细节”不能被全部解释成故意催泪的暗号。"},"outside":{"name":"《Unpacking》","detail":"玩家通过搬家和摆放日常用品，逐渐发现一个人在不同生活阶段的关系、职业与居住状况，而几乎没有传统剧情对白。","learning":"玩家亲自安排物件的操作，比阅读人物背景摘要更能建立一种认识。"},"decision":"线索像流水账，先想它有没有真实物态与可操作的生活用途。","pitfall":"把每一件日常物品都处理成伏笔，会让世界失去生活随机性。","task":"在阿秀旧铺选三件物品：只承担生活感的、体现性格的、能够提示因果的，各写一段玩家可观察证据。","patterns":["所有物件都解释结局","保留重要物证与平凡用品的层次","把人物全部背景写在一张纸上"],"questions":[{"prompt":"没缝完的衣裳必须是关键谜底吗？","options":["必须否则浪费资产","不必，也可以只是她真实的审美与生活愿望","必须变成冥婚嫁衣"],"correct":1,"why":"不承载谜题的日常细节也有价值。"},{"prompt":"旧铺里什么更容易让玩家感到有人生活过？","options":["中断的日常活计与个人整理习惯","墙上贴完整生平","每件物品写寓意说明"],"correct":0,"why":"使用痕迹允许玩家自己认识生活。"},{"prompt":"神龛真实供钱比点击一句台词多了什么？","options":["只是按钮更多","必定增加剧情分支","玩家亲自付出资源并承担自己的行动"],"correct":2,"why":"交互使角色行为成为玩家经验。"},{"prompt":"《Unpacking》最重要的表达媒介是？","options":["大段设定旁白","整理物件以及新旧空间之间的差异","所有人物的内心独白"],"correct":1,"why":"物件与位置的变化让玩家自行建构故事。"}],"ref":["toolbox","branching"]},{"id":"10","group":"C 游戏与环境","name":"玩法规则与玩家行动","mins":19,"objective":"把“角色经历危险”转化为“玩家亲自承担危险”。","theory":"游戏叙事不是给玩法加剧情皮。一个有意义的行动至少应要求观察、作出决定，并让后果可感知。玩家可以通过亲自违反规矩、支付代价或退却获得理解；这种理解比听NPC重复告诫更具体。","steps":["发现规则或异常","玩家做出行动","反馈与代价可读","重新调整下一个决定"],"own":{"scene":"背尸返程回头与神龛供钱","state":"返程通用能力落地·整章未完成","detail":"跑马梁已有回头额外损耗的玩法能力，正式上肩与返程演出还没完整接线；神龛双币供奉则已验收。它们分别把禁忌和民俗交换从说明变成了玩家主动行为。","learning":"规则必须在画面、资源与叙事中同声同气，而不是把难度当成情感。"},"outside":{"name":"《请出示文件》","detail":"玩家不断核对证件、处理通关者、维持家庭生存。工作的重复、惩罚与道德困境相互叠加，使制度成为可操作的体验。","learning":"玩家在执行工作时遭遇冲突，而不是仅从剧情知道世界残酷。"},"decision":"遇到“玩家只在看戏”，先找其中一个本来属于人物的决策，能否合理地交给玩家。","pitfall":"不能把所有情绪场面硬做成QTE或小游戏。","task":"比较“旁白警告不能回头”和“玩家亲自回头、持续损耗三把火”。指出何者传达知识、何者让玩家承担。","patterns":["再写两条禁忌说明","让玩家观察并操作禁忌，给予可信反馈","要求每条台词都按键确认"],"questions":[{"prompt":"禁回头最适合怎样形成戏剧压力？","options":["单靠NPC说三遍","通过玩家自己的操作与持续代价","直接展示最终Boss"],"correct":1,"why":"角色知道规矩和玩家执行规矩，是不同层次。"},{"prompt":"有意义的选择必须改结局？","options":["不必须，也可以改变过程、风险、损失或理解","必须有五种结局","必须增加巨量分支"],"correct":0,"why":"选择意义不等于分支数量。"},{"prompt":"神龛选择设计是否有效，优先看？","options":["总共画了多少硬币图标","系统按钮有多少","玩家是否理解并在意自己付出的是什么"],"correct":2,"why":"玩家的行动感与后果可读性才重要。"},{"prompt":"《请出示文件》给你的核心方法是什么？","options":["把伦理讨论全部放在过场","制度性压力直接通过日常操作显现","所有任务必须随机化"],"correct":1,"why":"玩法机制能够表达社会与个人处境。"}],"ref":["toolbox","branching"]},{"id":"11","group":"C 游戏与环境","name":"悬疑与作者—角色—玩家信息差","mins":20,"objective":"保留人物复杂，同时让事实层足够清楚。","theory":"对每一条线索分别问：作者知道什么、角色知道什么、玩家看到了什么、玩家合理推断了什么。谜团不必永远只有唯一解释，但关键物理因果不能靠“神秘”掩盖缺口。揭示可以增加人物情感，而不是单纯推翻前文。","steps":["建立作者事实","分配不同人物知情范围","决定玩家能发现的证据","验收漏看与不同解释"],"own":{"scene":"李天狗说书与阿秀调查","state":"茶馆说书已落地·阿秀调查未落地","detail":"茶馆把“李天狗大战旱魃”讲成英雄传奇，但那不是桃溪事实。阿秀可选线通过探潭失踪、雇鬼、湿布和村民见闻建立人物；主线可以只知道“有月娘这么个人”，深挖者认识她的重量不同。","learning":"一些玩家得到事件真相，一些玩家失去一个已认识的人：两种不同经验可以被有意保留。"},"outside":{"name":"《奥伯拉丁的回归》","detail":"玩家在船上调查死亡现场与人物关系，靠观察、听觉、档案和排除法逐渐还原命运。证据没有替玩家自动完成全部判断。","learning":"事实可以被证据约束，意义仍容许观众不同理解。"},"decision":"玩家“看过线索但没懂”时，先判断是证据显著性、解释路径还是事实逻辑问题。","pitfall":"不要靠突然改写先前规则来制造惊人反转。","task":"把阿秀旧铺、湿布、雇工传闻和山口四组信息分别列为“必知事实、可选了解、可推断心理”。","patterns":["所有人必须经过同一套解释演说","主线事实完整，自选线索决定认识人物深度","把所有证据做成无法检验的传闻"],"questions":[{"prompt":"李天狗大战旱魃的说书属于？","options":["作者世界真相","有社会传播事实的传说，不等于真实事件","玩家已验证的回忆动画"],"correct":1,"why":"讲述事件与讲述内容的真实性是两回事。"},{"prompt":"主线不强制阿秀调查，要保证？","options":["主线的必要因果仍自洽","所有线索一律删除","只有隐藏结局玩家才能知道任何事实"],"correct":0,"why":"不同深度的角色认识，不应破坏主线理解。"},{"prompt":"玩家越查越难判断阿秀，一定是叙事失败？","options":["一定","必须所有玩家得同一评分","不一定；要区分事实混乱与人物动机本来的复杂"],"correct":2,"why":"作者需控制信息准确性，却不必统一人的意义。"},{"prompt":"《奥伯拉丁的回归》最核心的认知玩法是？","options":["只看一段全知结局","玩家以可观察证据自行推断可检验事实","随时随机替换真相"],"correct":1,"why":"推断是玩家行动的一部分。"}],"ref":["toolbox","branching"]},{"id":"12","group":"D 情感与验收","name":"情感铺垫、回响与结局","mins":20,"objective":"让情感来自玩家曾共同度过的事情，而不是临时增加悲惨度。","theory":"高潮会把先前投入的行为、关系、物件与期待聚合起来。玩家为人物牵挂，不要求角色必须善良或一贯正确。结局需要决定什么，却可以不替玩家决定如何评判。","steps":["生活中建立牵挂","为人物保留真实选择","在高潮让早先经历回响","让结局后的意义留给玩家"],"own":{"scene":"阿秀山口化身与“我没有跑”","state":"隐藏终章为设计稿·未落地","detail":"阿秀死前想报完信再逃，却在抓住求救者的手时意外导致伏煞。玩家希望她走，可能同时舍不得那件救过自己的遗物和由此发生的全部相遇；这不是一个有唯一正确答案的善恶题。","learning":"越深入认识她，玩家失去的越像一个具体的人，而不只是一条事件真相。"},"outside":{"name":"《Before Your Eyes》","detail":"眨眼本是一种自然、未必被意识控制的身体行为，游戏将其与回忆片段的前进绑定。形式与主题共同制造时间留不住的体验。","learning":"参与方式本身能够让情感的意味发生变化。"},"decision":"高潮不疼时先检查前面的关系生活，而不是直接加悲惨遭遇。","pitfall":"不要把“必须让玩家哭”当验收标准；允许清醒而平静的选择。","task":"列出玩家想让阿秀走的3个私人理由，另列3条玩家可能根本不知道的作者事实。检查是否强制宣传作者价值判断。","patterns":["末尾增加解释性旁白","让选择承载玩家累积的私人牵挂","把走与回评为善恶等级"],"questions":[{"prompt":"山口选择最要避免什么？","options":["允许玩家选择走或回","给出作者盖章的道德评分","让历史不改变"],"correct":1,"why":"作品可以有明确因果，但不必剥夺玩家解释空间。"},{"prompt":"玩家得知阿秀早有求死念头，应产生什么可能性？","options":["理解更复杂，同时不取消她想活的事实","证明她一直想死，别无选择","推翻她经营十年铺子的快乐"],"correct":0,"why":"更深的心理事实不必吞掉其他真实愿望。"},{"prompt":"高潮不动人时，先检查？","options":["特效够不够大","有没有更多死亡","玩家之前是否真的与人物建立关系与投入"],"correct":2,"why":"情感由此前经验积累。"},{"prompt":"《Before Your Eyes》怎样将主题交给交互？","options":["只靠叙事旁白","眨眼推动回忆并改变玩家的时间感","必须选好结局才能继续"],"correct":1,"why":"身体动作承载了难以挽留时间的感觉。"}],"ref":["pixar"]},{"id":"13","group":"D 情感与验收","name":"玩家盲测与叙事质量回归","mins":18,"objective":"把创作效果变成可观察证据，而不让测试反过来毁掉创作。","theory":"玩家反应可分为：没看到信息、看到了但误解、理解正确却不关心、理解且关心却不赞同作者。只有前三类可能提示明确传达问题；第四类可能恰好是作品希望保留的解释空间。先让玩家自由复述，再问中性问题。","steps":["独立无提示体验","记录行为与原话","按问题类型归因","局部修改并重测"],"own":{"scene":"茶馆斗嘴与崖墓发活","state":"Cutscene资产已落地·主线版本对齐需核对","detail":"茶馆可盲测玩家对关二狗的第一印象；崖墓精调Cutscene在后巷有独立触发，而雾津街头还存在另一套雇主对白。应分别区分“素材存在、实际接线、玩家体验效果”。","learning":"不知道玩家怎么理解，不能只看作者反复验收自己的感觉。"},"outside":{"name":"《Pentiment》","detail":"玩家依据片面的证据和社会关系作出指控，后来承担社区层面的后果。这适合研究玩家如何对不完整故事建立不同判断。","learning":"不同解释不等于玩家没看懂；先定义哪些事实必须准确。"},"decision":"不要问“你是不是觉得阿秀特别可怜”，改问“你觉得她做过什么？有哪些地方不确定？”","pitfall":"不要根据1–2人的喜好立刻推翻整体风格，也不要用测试结果消灭全部暧昧性。","task":"对茶馆与崖墓设计5个中性访谈问题：复述事实、人物印象、注意焦点、继续意愿、最困惑处。","patterns":["让试玩者先读完整设定","独立观察理解与兴趣，分开归因","试玩者不喜欢二狗就立刻重写人设"],"questions":[{"prompt":"玩家准确复述剧情却无兴趣，这是？","options":["必然是贴图错误","参与动机或人物吸引力问题","一定要再说一遍任务"],"correct":1,"why":"理解和投入是两个指标。"},{"prompt":"哪种问题更中性？","options":["你觉得关二狗为什么接活？","你是不是觉得二狗很贪财？","这段喜剧让你笑死了吗？"],"correct":0,"why":"开放式问题能减少暗示。"},{"prompt":"A/B测试同时换镜头、对白和配乐，有什么问题？","options":["样本足够就一定没问题","更加科学","难以判断究竟是哪项改动造成差异"],"correct":2,"why":"定位型测试应尽量控制变量。"},{"prompt":"玩家理解完整但不同意阿秀回去，该怎么处理？","options":["必须劝服玩家","看这是否属于允许的解释差异，不自动当错误","立刻加入教训玩家的旁白"],"correct":1,"why":"不赞同是有时很有价值的玩家反应。"}],"ref":["gdc"]},{"id":"14","group":"E 戏剧动力拓展","name":"方法一：目标对抗","mins":16,"objective":"学会不靠背叛和反转，仅靠各方合理目标产生戏。","theory":"冲突不等于争吵。目标A与目标B可以各自合理，却受限于同一资源、时间、社会规则或不同解决方案而无法同时实现。特别要分清“想要同一结果”与“同意怎样做”。有时策略冲突比善恶冲突更耐看。","steps":["分出不同人物的真实目标","找到资源、时限或策略不兼容点","让双方采取具体行动","不必给任何一方贴坏人标签"],"own":{"scene":"亨利雇工、月娘查人与村民复工","state":"最新版人物事件设计·未落地","detail":"亨利需要进潭取石；失踪者家属急着找人；工人需要工钱但害怕下潭；月娘先受托查人又参与勘察。双方不需要先确定“谁是恶棍”，目标之间已经形成冲突。","learning":"人物的利益位置本身可以生戏，甚至不需要突然揭露隐藏身份。"},"outside":{"name":"《十二怒汉》","detail":"一位陪审员要求审慎审查证据，其他人希望尽快得出结论；他们都觉得自己在认真履行义务，却有不同时间、尊严和责任理解。","learning":"让行动的合理性在不同人物身上分别成立，争执自然发生。"},"decision":"对白平静却没戏，试着给各方一个互不兼容的具体目标，再让其争取。","pitfall":"不要把人物刻意写笨来制造冲突，也不要把分歧自动等同于价值观对立。","task":"给“阿秀拿回工钱”安排三方目标：老鬼要脱身、潭边索债鬼要钱、阿秀要核实并救回人。只写行动目标，不新增鬼的身份。","patterns":["突然让索债鬼公开变成亨利的父亲","让工钱、安危与查证时间互相挤压","让所有人无理由开始吵架"],"questions":[{"prompt":"双方都想救鬼却打算用不同方法，算冲突吗？","options":["不算，必须有坏人","算，策略与风险承担不同即可产生冲突","只有发生打斗才算"],"correct":1,"why":"冲突来源于目标和行动的不兼容。"},{"prompt":"最能让工人和亨利产生对抗的因素？","options":["高报酬与生命风险之间的冲突","工人突然集体失忆","亨利必须解释宇宙终极真相"],"correct":0,"why":"各方生存与经济目标能直接影响行动。"},{"prompt":"解决冲突的低质量捷径是什么？","options":["让具体资源变稀缺","表现谁愿承担更多风险","让一方莫名其妙说蠢话只为另一方胜利"],"correct":2,"why":"人为降智会破坏真实人性。"},{"prompt":"没有吵闹，是否可能有强烈冲突？","options":["不行，必须提高音量","可以，拒绝、拖延、保持沉默都可能是行动","没有动作就没有任何关系变化"],"correct":1,"why":"有目标的沉默也可能是一种对抗。"}],"ref":["scriptnotes","mckee"]},{"id":"15","group":"E 戏剧动力拓展","name":"方法二：压力递增","mins":17,"objective":"让一场戏不必翻转，也可以靠持续消耗越来越紧。","theory":"压力升级不仅是敌人数量增加。有效升级通常会逐次剥夺人物的资源、时间、可信的解释或可行方案，并迫使其采用新策略。建议区分“障碍难度加大”与“决策性质改变”：后者更能持续保持戏剧性。","steps":["建立目标与既有能力","让一个办法暂时奏效","用新事实或代价逼人物换策略","最后让人物作出不同于最初的行动"],"own":{"scene":"跑马梁背尸返程、守火与鬼打墙","state":"主要为待落地设计；通用控制能力部分已完成","detail":"先是背尸回头持续掉三把火，再是返程诱惑、分层鬼打墙、撒钱、跨图追逐。结构已规划，但鬼打墙、追逐和正式坠潭尚未完整实现。不要只把每段写成“鬼更凶了”，要让玩家必须不断改变做法。","learning":"持续压力适合替换过多的即时反转，让玩家自己累积紧张。"},"outside":{"name":"《爆裂鼓手》","detail":"鼓手持续练习，一次次受到更严格的演奏要求、权力压迫及自我目标冲突。挑战不仅更难，也在改变他付出的代价。","learning":"让升级直接改动人物必须舍弃的东西。"},"decision":"游戏越往后越吵却不紧张，判断每段是不是只是加特效，没有改变玩家需要做的决定。","pitfall":"单纯“怪物速度+10%”可能只是数值升级，不是新一层戏。","task":"为跑马梁返程设计3轮升级，每轮分别剥夺一类东西：信息可靠性、行动自由或安全资源。不要编写新的正典怪物。","patterns":["每轮只让鬼更大声","每轮改变玩家可用的方法或必须承担的代价","每次都在终点追加一次新反转"],"questions":[{"prompt":"真正的压力升级应改变什么？","options":["只有敌人外观","人物能否达成目标的方法与代价","仅有背景音乐音量"],"correct":1,"why":"决策和能力受到压缩，才是戏剧压力。"},{"prompt":"鬼打墙连续三次重复而无新信息，会怎样？","options":["容易变成机械拖延","必定越来越恐怖","自动形成高级象征"],"correct":0,"why":"重复如果不改变规则和认知，压力可能停滞。"},{"prompt":"从守火进入撒钱，最值得设计？","options":["相同操作重复十次","让关二狗突然会法术","让玩家为了继续逃脱放弃此前珍惜的资源"],"correct":2,"why":"资源取舍改变了行动性质。"},{"prompt":"《爆裂鼓手》的升级不是单纯什么？","options":["人物目标推进","练习强度增加的同时代价与人格关系变化","重复更响的敲鼓声音"],"correct":1,"why":"压力与心理和关系代价联动。"}],"ref":["toolbox"]},{"id":"16","group":"E 戏剧动力拓展","name":"方法三：悬念与等待","mins":17,"objective":"将“还没发生”变成真正的戏剧。","theory":"悬念的典型机制是：观众有可形成的预期，却不知道它何时、如何、是否兑现。为了让等待有戏，环境要持续提供微弱的新证据。纯粹让玩家站着等不会自动制造悬念。","steps":["建立明确信息缺口","让玩家对后果形成预测","在等待中给予小变化","选择兑现、错位或持续留下未知"],"own":{"scene":"到墓候更：灯下似乎有人，靠近发现无人","state":"正式设计已定方向·演出仍为空占位","detail":"当前已登记到墓候更的空Cutscene，要求“以为有人—主动靠近—发现无人”的完整演出尚需设计。适合用渐弱山风、孤灯与时间提示建立预期，而不是立刻跳出一个鬼。","learning":"观众等待的不是“出现新剧情”，而是“为什么灯亮着却没有人”。"},"outside":{"name":"《后窗》","detail":"主人公被限制在窗内，靠观察对面邻居的行为慢慢形成怀疑。观众与他一起等待迹象是否支持推断。","learning":"有限视野和可反复观察的细节，能形成持久悬念。"},"decision":"停顿无聊时检查观众是否正在等待某个具体后果，以及等待中有没有证据变化。","pitfall":"不要以为越多黑屏、越少信息就越神秘。","task":"为到墓设计20–40秒的“无怪显形”表演，只允许光、声、脚步、视角和环境变化；观众必须知道自己在等什么。","patterns":["让关二狗在原地空等毫无提示","让孤灯与无人之间产生可推断的矛盾","立即播怪物正面特写"],"questions":[{"prompt":"悬念成立的先决条件？","options":["观众对可能发生的事已有预期","保持完全不透明","必须有鬼突袭"],"correct":0,"why":"没有期待，等待通常只有无聊。"},{"prompt":"孤灯无人怎样最有效？","options":["只是场景里有一盏灯","玩家以为灯说明有人，却逐步找不到人","给出完整鬼怪设定百科"],"correct":1,"why":"建立预期，再通过事实侵蚀它。"},{"prompt":"悬念不等于什么？","options":["期待与不确定","可观察信息差","无限延长静止等待时间"],"correct":2,"why":"悬念并非单纯时间拉长。"},{"prompt":"《后窗》最值得借鉴的是？","options":["一定要让玩家坐在窗前","有限视角下反复观察证据，使怀疑升温","一开始公布所有真相"],"correct":1,"why":"悬念来自逐渐变化的证据解释。"}],"ref":["pixar","filmgram"]},{"id":"17","group":"E 戏剧动力拓展","name":"方法四：代价与不可兼得","mins":17,"objective":"让一次选择具有分量而不必变成道德选择题。","theory":"戏剧性代价来自“我希望两边都得到，但处境不允许”。代价可能是金钱、时间、安全、尊严、对他人的承诺，也可能是无法实现的一段可能人生。重要的是代价可被角色或玩家实际感知。","steps":["两种愿望都先成立","建立不可兼得的具体约束","让人物主动选择行动","保留失去的那一边的重量"],"own":{"scene":"神龛供钱与阿秀山口抉择","state":"供钱已落地；山口终章未落地","detail":"神龛供奉把玩家手中铜钱或私铸钱变为真实支出。阿秀山口则是更深层的代价：玩家希望她活着，也可能因此失去由她遗物开启的整段相遇；历史不可改变。","learning":"小代价训练玩家尊重世界的物件，大代价才能承受此前关系的积累。"},"outside":{"name":"《一次别离》","detail":"两人的人生安排与照顾父亲的现实责任互相挤压；不是说“都很重要”就能同时满足。","learning":"让不可兼得来自现实约束，而非作者临时宣布必须二选一。"},"decision":"选择没有重量时，检查两边是否都曾具体地值得拥有。","pitfall":"不要让每次付出都有清楚的道德收益；真实代价不保证被奖励。","task":"任选神龛或山口，为两个选项分别写一条“实际得到”和“实际放弃”；禁止写“好人选A”。","patterns":["让两边都有价值与真正的损失","一边标成正确，一边标成愚蠢","让选择不产生任何可被理解的区别"],"questions":[{"prompt":"代价选择最需要什么？","options":["两个都必须合理并且不能全拿","五个不同结局","明确写出善恶评分"],"correct":0,"why":"若一项毫无价值，决定就没有内在重量。"},{"prompt":"阿秀山口为何能让玩家犹豫？","options":["因为选择按钮很难按","玩家想让她生存，却可能失去与她的相遇因果","因为NPC要求选错"],"correct":1,"why":"玩家自身的牵挂进入取舍之中。"},{"prompt":"什么会削弱代价感？","options":["真实消耗资源","选前对两边都有认识","每次牺牲必然获得全额补偿"],"correct":2,"why":"无损取舍通常难以形成失去感。"},{"prompt":"《一次别离》的冲突核心是什么？","options":["单纯靠秘密身份反转","人物的现实义务与个人前途发生不可兼得","每个角色无端恶意"],"correct":1,"why":"代价来自现实关系与责任。"}],"ref":["scriptnotes","mckee","branching"]},{"id":"18","group":"E 戏剧动力拓展","name":"方法五：关系牵挂与低烈度戏","mins":17,"objective":"学会让平凡相处变成未来悲喜的重量。","theory":"关系戏不必围绕大事。被记住的习惯、欠账、等待、一起干活、无意义的小玩笑都能让玩家感到两个人曾经共同生活。它的戏剧动力是“我在乎这个人怎么看我、会不会回来、能否继续在一起”。","steps":["先建立共同生活史","选择一个具体微小习惯","让关系在小行动中显露","不必当场兑现重大悲剧"],"own":{"scene":"夜遇癞子和茶馆的熟人关系","state":"夜遇癞子对白已落地","detail":"癞子在两步地上来回踱步，等二哥请他睡铺。关二狗已经赌光钱，最难受的也许不是损失，而是没有办法实现答应过的小事。癞子仍只提醒他早点回来。","learning":"“二哥，你早点回来”因之前的等待而获得重量，不需要在本场解释友谊意义。"},"outside":{"name":"《东京物语》","detail":"父母探望成年子女，交通、工作、安排时间与琐碎照顾不断显露关系的亲疏。这些小事不需要爆发性反转。","learning":"观众会从谁抽出时间、谁没有时间看见真实关系。"},"decision":"玩家对角色“觉得很惨但不心疼”，先检查是否有足够活着的时光和具体关系。","pitfall":"不要把每个温柔小事都设为死亡伏笔，人物可以单纯过日子。","task":"在雾津增加一个不承担主线任务信息的熟人行为：既能体现关系，又不需要给玩家奖励。只作纸面构思。","patterns":["在出事前临时宣布“我们是最好的兄弟”","通过一次真实等待与微小照顾让关系被观察","马上安排所有熟人死亡"],"questions":[{"prompt":"癞子重复走两步的设计价值？","options":["说明角色路径规划算法很先进","用身体行为传达等待与依赖","告诉玩家有隐藏成就"],"correct":1,"why":"生活性动作可以建立关系。"},{"prompt":"一段关系必须经过大事件才有情感吗？","options":["不必，小习惯与承诺可以积累","必须有人牺牲","必须出现重大欺骗"],"correct":0,"why":"低烈度场景可提供对人物的眷恋。"},{"prompt":"阿秀旧铺十年生活最值得保留什么？","options":["全部细节都是伏笔","所有街坊都要讨厌她","真实的生计、习惯、关系与并不戏剧化的日常"],"correct":2,"why":"人物要先生活，后来事件才有损失的对象。"},{"prompt":"《东京物语》主要说明？","options":["观众只关心离奇反转","照顾、等待与日程安排也能体现关系与情感重量","家庭戏不能有空间设计"],"correct":1,"why":"简单生活行为也能塑造复杂关系。"}],"ref":["pixar","mckee"]},{"id":"19","group":"E 戏剧动力拓展","name":"方法六：行为揭露人格","mins":17,"objective":"不用反转与角色自述，靠一个具体行动建立性格。","theory":"行为揭露不是“角色做了好事就证明他善良”。更常见的是行动暴露他此刻的注意力、优先级、羞耻感和欲望。行为越具体，人物越难被压缩成标签。可以通过动作与台词相反，但不要求每次都设计反差。","steps":["观察角色面前的具体事情","让行动要求一点小选择","记录角色真正付出了什么","允许结果不够体面"],"own":{"scene":"崖墓任务发布：挑私铸钱仍算进总数","state":"已落地·精调Cutscene","detail":"雇主走了，二狗蹲下数钱，怀疑一枚是私铸的，仍然说“算你一个”。他没有发表任何贪财宣言，但玩家已经知道钱对他究竟意味着什么。","learning":"更重要的是这种行为保留了关二狗活人的滑稽，不只是功能性“贪婪属性”。"},"outside":{"name":"《完美的日子》","detail":"主角重复清洁厕所、整理随身物件、摄影与听音乐。人物通过工作方式与日常注意力被认识，而不是通过心理独白完全说清。","learning":"重复的选择与注意对象能够刻画一个人的生活态度。"},"decision":"角色人设都在对话里时，问能否替换成玩家可观察的一次决定或一次处理物品的方式。","pitfall":"小动作也不能每次都背负复杂象征；让它保持自然。","task":"关掉崖墓Cutscene字幕，写下仅从二狗站位、靠近、蹲下、数钱就能读出的三个特征。","patterns":["加入人物性格百科","让他有一个带具体选择的小行动","增加“贪财+10”的画面字样"],"questions":[{"prompt":"“算你一个”说明什么？","options":["二狗如何具体处理自己重视的钱","私铸钱已经被官方批准流通","人物必须被定义为恶人"],"correct":0,"why":"行为能传达优先级而不替人物下总判词。"},{"prompt":"一个角色对白写得很深却不像活人，该检查？","options":["所有句子是否押韵","有没有足够的实际行动、习惯与具体选择","是否每句都引用经典"],"correct":1,"why":"人的习惯和行为可以比自我解释更可观察。"},{"prompt":"表现“他真的关心癞子”的可靠手段？","options":["他说一百次兄弟","编剧写角色设定善良","他在生活中为癞子承担一项看得见的麻烦或代价"],"correct":2,"why":"可观察的具体付出比口头宣称有力量。"},{"prompt":"《完美的日子》提醒我们？","options":["简单劳动不可能有戏","人物可以通过重复的日常工作与选择被认识","必须有十个反派才能撑长片"],"correct":1,"why":"日常行为能成为叙事核心。"}],"ref":["pixar","mckee"]},{"id":"20","group":"E 戏剧动力拓展","name":"方法七：重复、变奏与累积","mins":17,"objective":"用微小变化持续加重意义，不必不断引入新设定。","theory":"重复并不等于机械。第一次建立规律，第二次验证规律，第三次让规律发生细微偏移，观众会自己比较。变奏可以发生在声音、物件、空间、行为与关系上。一个反复出现的细节可以只作生活线索，不需要最终变成宏大伏笔。","steps":["建立可被记住的形式","在第二次保持关键相似","第三次改变一项有意义的条件","让玩家自己完成对照"],"own":{"scene":"阿秀救老鬼与不断滴水的湿布","state":"新版设定稿·未落地","detail":"老鬼衣物滴水；脱掉一层仍然滴；鬼从无洞地面沉没后，留在桌上的残布再次滴水。恐怖不是靠三种不同怪物，而是同一个不可解释现象在不同阶段扩大。","learning":"熟悉的“滴水”变成世界不受阿秀控制的证据。"},"outside":{"name":"《Unpacking》","detail":"搬家反复出现，但相同物件在不同空间、不同人际关系和不同年龄阶段呈现不同意义。","learning":"重复能让观众拥有自己的比较基线。"},"decision":"场景平淡时，尝试复用已有物件并改变其处境，而不是再创造一个新怪物。","pitfall":"没有有意义条件变化的重复会显得冗长。","task":"把湿布的三次出现列成“观众第一次以为”“第二次推翻什么”“第三次最怕什么”。","patterns":["每次增加全新的无关怪物","复用滴水现象，但逐次改变阿秀的判断和行动","直接把鬼的身份全部公开"],"questions":[{"prompt":"同一块湿布反复滴水为什么可能越来越恐怖？","options":["因为玩家可以对照已经建立的规律与新条件","因为播放了三遍相同声音","因为素材复用节省成本"],"correct":0,"why":"重复通过认知对照获得意义。"},{"prompt":"什么会让重复变成拖延？","options":["条件逐步变化","每轮信息与局面完全一样","玩家自己推断变化"],"correct":1,"why":"单纯复制不等于变奏。"},{"prompt":"一件生活用品反复出现的要求是什么？","options":["必然在结局解密","必须每次播放特写","可以因处境不同而显露人物经历，不必次次成为伏笔"],"correct":2,"why":"物品生命感来自日常使用与变化。"},{"prompt":"《Unpacking》的“重复”怎样使故事推进？","options":["纯增加搬家次数","物件与摆放空间的微小差异不断更新玩家认识","每个箱子里都有反派"],"correct":1,"why":"被比较的差异逐渐构成生活史。"}],"ref":["toolbox"]},{"id":"21","group":"E 戏剧动力拓展","name":"方法八：信息差与戏剧性反讽","mins":17,"objective":"让观众知道的与角色知道的错位，从而改写同一个动作的意味。","theory":"信息差有多种方向：观众知道更多会形成悬念，角色知道更多会形成好奇，双方都知道一部分则形成猜测与误解。戏剧性反讽不是搞笑；当观众知道后果而角色不知道时，一个普通动作可能变得痛苦。","steps":["列出四层知情范围","决定哪一层领先","让领先信息改变观众对行动的期待","不要泄露作者层解释"],"own":{"scene":"李天狗民间传奇与关二狗误认","state":"说书/斗嘴已落地；后续相遇部分设计","detail":"茶馆把李天狗塑造成轻松降妖的神人，真实的李天狗却曾无法阻止灾难。关二狗后来遇真道士，甚至把对方关心桃溪的询问吹成“向我请教”。若玩家比二狗知道得多，会有另一层意味。","learning":"同一句吹牛，因观众知识不同，可以是可笑，也可以是苦涩。"},"outside":{"name":"《后窗》","detail":"观众在有限的观察中越来越怀疑邻居有问题，而一些角色并不知道同一信息。后来普通动作因此带上危险感。","learning":"控制知识差不是“谁藏得更多”，而是“知道以后怎样重新看动作”。"},"decision":"戏剧性反讽无效时，检查观众是否真正获得了领先角色的关键信息。","pitfall":"不要让作者掌握的机制未经证据直接通过NPC台词泄露。","task":"给“二狗说真道士向我请教”设计两种玩家知识状态：不知道李天狗身份；已经识破其身份。写下笑点如何变化。","patterns":["让角色与玩家永远全知","通过不同知情深度改变同一行为的意义","让所有NPC互相无故猜错"],"questions":[{"prompt":"观众比二狗更早知道李天狗身份，会发生什么？","options":["同一句吹牛可产生戏剧性反讽","游戏自动不能理解","必须当场改写剧情事实"],"correct":0,"why":"信息差能改变笑料和同情的方向。"},{"prompt":"角色知道更多，观众不知道，通常首先产生？","options":["道德评分","对角色秘密的好奇或不确定","任何情况都很搞笑"],"correct":1,"why":"知情关系控制的是观众的期待。"},{"prompt":"哪种是信息差设计的低质量实现？","options":["让不同证据到达不同人","让观众把握一条明确信息","作者随意隐瞒一切关键因果导致玩家无法推断"],"correct":2,"why":"无证据的遮蔽不等于悬念。"},{"prompt":"戏剧性反讽是否必须让人笑？","options":["必须","不，它也能造成不安、同情与悲剧感","只有出现误听才能算"],"correct":1,"why":"反讽来自知情差而非单一喜剧效果。"}],"ref":["scriptnotes"]},{"id":"22","group":"E 戏剧动力拓展","name":"方法九：因果回响与再语境化","mins":17,"objective":"让玩家此前亲自做过的事，在后来拥有另一层重量。","theory":"回响不是简单重复台词，也不一定是强制反转。最好的回响保留了早先事件的真实性，同时让后来的知识、损失或回访赋予它新语境。游戏尤其可以让“我曾经做过”成为情绪来源。","steps":["先让早期事件独立成立","保留玩家可记住的物或行动","在后期建立新的因果关系","让玩家自己重新理解当初"],"own":{"scene":"神龛捐钱与阿秀帕子包","state":"神龛早期交互已验收；后期揭示未实现","detail":"跑马梁入口地藏神龛可供奉两种钱；独立状态机要求真正坠潭后回访才揭示。另一条更长的回响是旧帕子包：最初只是二狗贪财捡起的东西，深挖阿秀后会成为她生活过的实物联系。","learning":"物件仍然是同一个，变化的是玩家带回来的生活经验和知识。"},"outside":{"name":"《奥伯拉丁的回归》","detail":"船上许多短暂的死亡画面，最初只是推理线索；当玩家辨认出具体的人与关系，早先同一场景会被重新理解。","learning":"新的知识不必否定最初所见，也可以提升它的个人重量。"},"decision":"故事各段像孤岛时，找一件已经被玩家亲手用过的物或行为，看看后来能否得到自然回响。","pitfall":"不要把所有小事都规划为结局催泪道具，否则会显得过度算计。","task":"为帕子包写两栏：第一次捡到时观众的解释；深挖月娘以后重新见到时的解释。不能写“其实阿秀在保护他”。","patterns":["把所有以前剧情判定为假的","保留旧事实，新增能让旧行动改变意义的真相","后期用旁白逐条解释所有伏笔"],"questions":[{"prompt":"帕子包后期形成情感回响，关键是什么？","options":["改变玩家对同一物的认识，而不改变其既有物理事实","宣布它其实是魔法武器","让它自己向二狗表白"],"correct":0,"why":"再语境化强调旧事实与新认识的共同作用。"},{"prompt":"神龛坠潭后回访，为什么可能比自动播揭示更有分量？","options":["因为一定多奖励经验值","玩家亲自回到自己曾经操作过的地方","因为回访越远越好"],"correct":1,"why":"“我再次来到这里”本身可以成为经历。"},{"prompt":"什么可能制造过度设计感？","options":["有生活性细节","允许没有象征意义的日常","每个日常小物件都最终兑现为重大伏笔"],"correct":2,"why":"生活世界需要保留不被目的化的细节。"},{"prompt":"回响必须是“前文都是假的”吗？","options":["必须，否则不算反转","不，旧场景仍真实，只是新证据改变情感意义","必须抹去玩家之前的理解"],"correct":1,"why":"真正有后劲的回响往往不撤销前面的情感。"}],"ref":["toolbox","branching"]},{"id":"23","group":"E 戏剧动力拓展","name":"方法十：规则施压与具身冲突","mins":18,"objective":"把戏剧性的来源从剧情反转延伸到玩家身体性的决策压力。","theory":"具身冲突指玩家亲自做某件难事，必须分配注意、控制移动、估算风险、承担损失。关键不在QTE形式，而在规则是否真实表达了场景中的禁忌、职业困难或道德处境。优秀系统会让玩家有自主策略而非只按导演命令执行。","steps":["提供可理解的行动约束","让玩家感到选择成本","给出可观察反馈","允许失败、退却或改变策略"],"own":{"scene":"跑马梁背尸返程与供奉","state":"背尸限制通用能力部分落地·整章未完成","detail":"返程设计要求慢行、回头损耗、维持火源与被引诱的注意力冲突。双币供奉是真实交易。玩家不靠旁白理解“忌回头”，而可能在实际操作中学会为什么这件事难。","learning":"用限制组织戏剧，而不是以频繁剥夺操作权装作恐怖。"},"outside":{"name":"《请出示文件》","detail":"检查证件的枯燥手续逐渐牵出家庭生存、制度罚款与对陌生人的同情。玩家不只是观看道德困境，而是必须自己完成表格与盖章。","learning":"规则能够把“世界是什么样”变成“我怎样在里面活”。"},"decision":"规则做完仍像小游戏时，检查它是否与人物目标、资源和世界禁忌真实关联。","pitfall":"纯操作惩罚而不给玩家理解来源，可能产生挫败而非戏剧张力。","task":"设想背尸途中玩家听见身后有人喊：分析回头成本、继续前进风险、火把剩余量怎样一起改变决策；不新设完整剧情。","patterns":["增加更密集的无提示QTE","让禁忌、身体操作与风险反馈互相作用","所有重要决定都自动过场完成"],"questions":[{"prompt":"背尸的“不能回头”为什么适合操作表达？","options":["只是展示更多动作特效","玩家需要亲自抵抗信息诱惑并承担损耗","玩家必须知道作者如何写代码"],"correct":1,"why":"身体约束把故事变成参与者经验。"},{"prompt":"怎么避免规则变成单纯惩罚？","options":["给予可观察反馈与学习空间","让玩家任何行为都随机死亡","禁止玩家发现规律"],"correct":0,"why":"有因果可学，压力才有策略意义。"},{"prompt":"让玩家承受恐怖，应做到？","options":["完全剥夺操作","不提供任何决策空间","给予可理解的行动目标、代价与可尝试策略"],"correct":2,"why":"玩家参与不只是按键繁忙。"},{"prompt":"《请出示文件》的规则和伦理怎样结合？","options":["伦理全在过场里","玩家通过日常操作亲自承受规则与个体遭遇的矛盾","检验证件只是装饰"],"correct":1,"why":"过程本身能够承载主题。"}],"ref":["toolbox","branching"]},{"id":"24","group":"F 综合实战","name":"最终综合：总导演决策工作台","mins":25,"objective":"学会在复杂场景中区分哪些问题该用直觉、哪些要调用工具。","theory":"综合审查不等于一次用上所有技巧。先确定场景不可改变的事实，再确定希望玩家经历的情绪或行动。然后只选最相关的1–2种戏剧动力，划分镜头、角色动作、声音与反馈。最后通过不同熟悉度的玩家做对照验收。","steps":["冻结事实和人物边界","只选一两种核心戏剧动力","将它们落实到视听或交互","用盲测修真实失效环节"],"own":{"scene":"跑马梁到墓候更：从空占位到可演场景","state":"已存在空Cutscene与状态；表现仍待设计","detail":"故事事实是二狗到墓、以为有人、候更、发现无人。你可以选择悬念等待+环境声，也可以选择关系/行动喜剧+突然静默，但不能凭空补出原设计没有的阴谋。只在方案合理性范围内试验。","learning":"这是一次“把概念写成体验”的决策题，不要求实现或修改GameDraft。"},"outside":{"name":"《玩乐时间》＋《后窗》＋《请出示文件》","detail":"三种截然不同的动力：空间里同时发生的行动、长期可观察的悬念、亲手操作规则带来的压力。综合创作时不应把三者统统塞进同一场戏，而应该选最适合目标的一组。","learning":"同一题材可以用不同机制表达，选择是导演价值判断而非公式计算。"},"decision":"当你考虑十个方案却拿不定主意，先明确一个不可让步的玩家体验目标，然后删掉抢它注意力的方案。","pitfall":"评价一节戏不能只查是否有反差、是否有完整状态机；也不要为了课程内容而强行丰富新系统。","task":"做一页到墓候更导演卡：事实边界、玩家预期、首要戏剧动力、画面焦点、声音节奏、玩家行动、一个验收问题。","patterns":["先锁定体验目标再挑工具","把所有十种动力全部叠加","根据某本教材硬套完整结构"],"questions":[{"prompt":"综合导演第一次做什么？","options":["立刻加入所有技巧","明确场景不可变事实与玩家体验目标","先安排所有角色开口解释"],"correct":1,"why":"目标与约束是筛选方法的依据。"},{"prompt":"到墓候更最适合立刻做的实验？","options":["用孤灯、声音与行动建立预期，检验等待是否有戏","提前揭晓全部鬼怪真相","立刻接跨图Boss追逐"],"correct":0,"why":"现阶段要验证等待与“灯下无人”的具体演出。"},{"prompt":"课程学完后创作是否必须每步系统化？","options":["必须严格按24步创作","所有问题都交给AI选","不，构思靠直觉；方法用于卡点、比较和验收"],"correct":2,"why":"理论扩展可能性，不替代主观判断。"},{"prompt":"测试显示玩家没发现关键声音变化，最合理的修复方向？","options":["立刻重写阿秀整条支线","局部调整声场对比、触发与玩家注意力，再盲测","用旁白宣布恐怖理由"],"correct":1,"why":"先在真正失效环节做局部回归。"}],"ref":["pixar","toolbox","gdc"]}]</script>

function stageLab(l){return `<div class="card"><div class="eyebrow">LIVE DIRECTOR'S BLOCKING BOARD</div><h2 style="margin-top:8px">后巷·走位与镜头实验</h2><p class="muted">根据“崖墓尸任务发布”的人物位置和演出顺序制作的空间概念沙盘。坐标经过可视化重排；不是实际运行画面或逐像素镜头。</p><div class="labSplit"><div><div id="stageVisualization">${renderStageSvg()}</div><div class="sourceTag" style="margin-top:8px">C标注取景中心。摄像机缩放改变玩家看见的范围，不是将镜头真的搬到人物脚下。</div></div><div class="stack"><div><label class="controlLabel">选择演出拍</label><select class="select" id="stageBeat" onchange="model.shotBeat=Number(this.value);stageChange()">${['1. 听见雇主喊名','2. 看清身份，改变态度','3. 谈价格和禁忌','4. 雇主沿巷离场','5. 二狗独自蹲下数钱'].map((x,i)=>`<option ${model.shotBeat===i?'selected':''} value="${i}">${x}</option>`).join('')}</select></div><div><label class="controlLabel">镜头优先关注谁</label><div class="buttonRow" id="stageFocusButtons">${[['both','双人关系'],['dog','关二狗'],['employer','雇主']].map(([k,n])=>`<button class="btn small ${model.shotFocus===k?'primary':''}" onclick="model.shotFocus='${k}';stageChange()">${n}</button>`).join('')}</div></div><div><div class="flex between"><label class="controlLabel">模拟取景缩放</label><strong id="stageZoomLabel" class="mono">${model.shotZoom.toFixed(1)}×</strong></div><input class="slider" type="range" min="1" max="2.5" step="0.1" value="${model.shotZoom}" oninput="model.shotZoom=Number(this.value);stageChange(false)" /></div><div class="experimentReadout"><div class="label2">导演观察</div><p id="stageStatus">${stageComment()}</p></div></div></div></div><div class="card subtle" style="margin-top:14px"><h3>四问复盘</h3><div class="stepGrid"><div class="step"><span class="stepNo">01</span><div class="stepName">玩家先注意谁？</div></div><div class="step"><span class="stepNo">02</span><div class="stepName">人物距离怎样改变？</div></div><div class="step"><span class="stepNo">03</span><div class="stepName">能否看见关键反应？</div></div><div class="step"><span class="stepNo">04</span><div class="stepName">有无抢焦点的动作？</div></div></div></div>`}
function renderStageSvg(){const focus=model.shotFocus,zoom=model.shotZoom,step=model.shotBeat,where=[{dog:[570,190],man:[252,165]},{dog:[422,177],man:[253,165]},{dog:[388,174],man:[253,165]},{dog:[401,197],man:[740,265]},{dog:[336,208],man:null}][step];let center=focus==='dog'?where.dog[0]:focus==='employer'?(where.man?where.man[0]:where.dog[0]):where.man?(where.dog[0]+where.man[0])/2:390;const vw=810/zoom,vh=330/zoom;const view=[center-vw/2,170-vh/2,vw,vh].join(' ');return `<svg class="svgStage" viewBox="${view}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="概念化的后巷人物走位和镜头范围"><defs><pattern id="brick" width="38" height="22" patternUnits="userSpaceOnUse"><path d="M0 1 H38 M18 1 V22 M0 22 H38" stroke="#597080" stroke-opacity=".3" fill="none" /></pattern></defs><rect x="-200" y="-150" width="1300" height="650" fill="#1b2e3b"/><rect x="0" y="0" width="850" height="105" fill="#2e4452"/><rect x="0" y="0" width="850" height="105" fill="url(#brick)"/><path d="M0 100 H850" stroke="#9caab3" stroke-width="3"/><rect x="0" y="108" width="850" height="232" fill="#253845"/><path d="M0 291 C135 258 300 301 480 279 S725 270 850 249" stroke="#445d6c" stroke-width="12" fill="none" opacity=".3"/><path d="M30 119 L810 301 M15 195 L840 170" stroke="#597387" stroke-width="1" stroke-dasharray="7 9" opacity=".35"/><rect x="68" y="18" width="113" height="80" fill="#20313e" stroke="#6e8392"/><path d="M70 26 H180" stroke="#c9ba8f" stroke-width="3"/><text x="70" y="51" font-size="17" fill="#c5d9e5">后巷</text><text x="70" y="75" font-size="11" fill="#9db3c1">角色调度简图</text>${step>=3?'<polyline points="253,165 260,205 308,286 490,304 740,265" fill="none" stroke="#7bc1c4" stroke-width="3" stroke-dasharray="9 8" opacity=".8"/>':''}<circle cx="${where.dog[0]}" cy="${where.dog[1]}" r="30" fill="#a36c48" stroke="#ffd7a3" stroke-width="3"/><text x="${where.dog[0]}" y="${where.dog[1]+6}" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">狗</text><text x="${where.dog[0]}" y="${where.dog[1]+48}" text-anchor="middle" font-size="13" fill="#f6c7a3">关二狗</text>${where.man?`<circle cx="${where.man[0]}" cy="${where.man[1]}" r="30" fill="#326471" stroke="#b2e2e4" stroke-width="3"/><text x="${where.man[0]}" y="${where.man[1]+6}" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">雇</text><text x="${where.man[0]}" y="${where.man[1]+48}" text-anchor="middle" font-size="13" fill="#a4dce1">雇主</text>`:''}<line x1="${center-14}" y1="170" x2="${center+14}" y2="170" stroke="#e7c08f" stroke-width="2"/><line x1="${center}" y1="156" x2="${center}" y2="184" stroke="#e7c08f" stroke-width="2"/><circle cx="${center}" cy="170" r="20" stroke="#e7c08f" stroke-width="1.6" fill="none" stroke-dasharray="4 5"/><text x="${center+20}" y="153" font-size="12" fill="#f4daa9">C</text></svg>`}
function stageComment(){const arr=['开场：谁喊他？二狗的视线寻找声音来源。双人画面保留了陌生雇主所在位置。','认出身份：二狗靠近，实际的心理变化来自措辞与位置关系一起转折。','报价段：想看快速改口，可测试让二狗的身体反应更醒目；要表现交易社会关系，则保留双人。','离场段：雇主移走后，镜头若仍紧跟他，可能抢掉二狗追问余钱的注意力。','数钱段：场面中心已变成关二狗与钱。雇主离画有助于让人物的独处行为成立。'];return arr[model.shotBeat]+(model.shotZoom>2?' 注意：镜头现在很紧，可能牺牲空间上下文。':'')}
function stageChange(rerenderButtons=true){const z=document.getElementById('stageVisualization');if(!z)return;z.innerHTML=renderStageSvg();document.getElementById('stageStatus').textContent=stageComment();document.getElementById('stageZoomLabel').textContent=model.shotZoom.toFixed(1)+'×';if(rerenderButtons){document.querySelectorAll('#stageFocusButtons button').forEach((el,i)=>el.classList.toggle('primary',["both","dog","employer"][i]===model.shotFocus))}}
function rhythmLab(l){return `<div class="card"><div class="eyebrow">PACING LAB</div><h2 style="margin:8px 0">停顿与预期的A/B对照</h2><p>在原版崖墓任务发布Cutscene里，关二狗蹲下之后有约2秒明确等待；这里只改变这一处等待时间，模拟可能出现的节奏差异。不是现有过场真实视频。</p><div class="labSplit"><div class="panel"><div class="flex between"><label class="controlLabel">蹲下后开始数钱前等待</label><strong id="pauseNumber" class="gold mono">${(model.pause/1000).toFixed(1)}s</strong></div><input id="pauseSlider" class="slider" type="range" min="200" max="3400" step="200" value="${model.pause}" oninput="model.pause=Number(this.value);updateRhythm()"/><div class="flex between small dim"><span>0.2秒</span><span>原版2秒</span><span>3.4秒</span></div><div style="margin:21px 0"><div class="small muted">示意时间块</div><div style="display:flex;gap:5px;align-items:center;margin-top:7px"><div style="flex:1;height:34px;background:#537588;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:11px">蹲下</div><div id="pauseBlock" style="flex:${model.pause/600};height:34px;background:#bd8b53;border-radius:5px;display:grid;place-items:center;color:#101923;font-size:11px;min-width:32px">等待</div><div style="flex:1;height:34px;background:#537588;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:11px">数钱</div></div></div>${btn('▶ 播放节奏预览',"playPauseLab()",'primary')}${btn('恢复原版2秒',"model.pause=2000;document.getElementById('pauseSlider').value=2000;updateRhythm()",'small')}<div id="pausePlayback" class="clip" style="margin-top:14px;min-height:61px">等待你主动播放。不会使用游戏音频或修改真实演出。</div></div><div class="stack"><div class="experimentReadout"><div class="label2">导演假设</div><p id="rhythmComment">${rhythmComment()}</p></div><div class="clip">本实验只能帮助你提出有理由的A/B假设。实际停顿可能被台词自动前进、人物动画及玩家交互节奏改变，必须完整播放验证。</div><div class="label2">相关场景</div><p class="muted small">${esc(l.own.detail)}</p></div></div></div>`}
function rhythmComment(){return model.pause<800?'等待很短，可能令数钱动作更迫不及待，但容易丢失一个观察角色反应的窗口。':model.pause<1500?'偏快，可能适合滑头急忙数钱的喜剧感；需要看片段前后的动作是否顺畅。':model.pause<=2400?'中等停顿。若有抓钱袋、盯钱或手部动作，会形成更明显的期待；若画面静止，可能显得拖沓。':'较长停顿会让观众期待一个更大的反应。若只是常规开始数钱，可能破坏轻巧的笑点。'}
function updateRhythm(){const n=document.getElementById('pauseNumber');if(!n)return;n.textContent=(model.pause/1000).toFixed(1)+'s';document.getElementById('pauseBlock').style.flex=String(model.pause/600);document.getElementById('rhythmComment').textContent=rhythmComment()}
let playing=false;function playPauseLab(){const el=document.getElementById('pausePlayback');if(!el||playing)return;playing=true;const time=model.pause,originalRoute=location.hash;el.innerHTML='<span class="gold">01 / 关二狗蹲下</span><p>他并没有马上开口。</p>';setTimeout(()=>{if(location.hash!==originalRoute){playing=false;return}const e=document.getElementById('pausePlayback');if(e)e.innerHTML='<span class="gold">02 / 观众等待</span><p>现在停顿 '+(time/1000).toFixed(1)+'秒：观众在期待他下一步做什么……</p>'},300);setTimeout(()=>{if(location.hash!==originalRoute){playing=false;return}const e=document.getElementById('pausePlayback');if(e)e.innerHTML='<span class="gold">03 / 数钱</span><p>“一……二……三……龟儿这个是私铸的嘛？”</p>';playing=false},time+350)}
function knowledgeLab(l){return `<div class="card"><div class="eyebrow">KNOWLEDGE & EMOTION SIMULATOR</div><h2 style="margin:8px 0">同一段山口结局，不同玩家认识深度</h2><p>下面只切换玩家可能掌握的信息，不改变已经发生的历史事实。它是说明不同信息层的实验，不是建议游戏强制按此顺序发放所有线索。</p><div class="labSplit"><div class="panel"><label class="controlLabel">玩家认识阿秀到什么程度？</label><input id="revealSlider" class="slider" type="range" min="0" max="3" value="${model.reveal}" step="1" oninput="model.reveal=Number(this.value);updateReveal()"/><div class="flex between small dim"><span>知道异常</span><span>知道经历</span><span>深度认识</span></div><div id="revealResult" style="margin-top:20px">${renderReveal()}</div></div><div class="experimentReadout"><div class="label2">绝对不变的历史事实</div><p>阿秀确实逃到桃溪南山口；确实回村示警；洪水来自亨利的炸潭；她救落水者时意外引发伏煞并魂散。玩家对她了解多少，不会改写这些事件。</p><div class="label2">作者层与玩家层</div><p class="small muted">玩家可因为接触到的物件、人物见闻和过去经历不同，而产生不同深度的眷恋；这种情绪差异并非自动属于信息传达失败。</p></div></div></div>`}
function renderReveal(){const a=[['知道异常','旧帕子包使二狗多次濒死未能松手，桃溪还有不明的旧灾。','对某种未知存在感到好奇、戒备或害怕。'],['知道事件','亨利雇工失败请月娘调查；她回村示警并在救人时引发伏煞。','知道一段事件真相，可能赞赏或批评她的行动。'],['认识人物','她精明、爱美、挣钱、办过鬼事，也会逃跑；桃溪有真实的生计与关系。','玩家可能开始希望她拥有与自己无关的未来。'],['更深层的猜测','从多处生活痕迹中，或可怀疑她多年来自我厌恶、偶有求死念头；但她珍惜生活与恐惧仍真实。','玩家知道得更多，却未必能够更容易断定她真正想要什么。']];const z=a[model.reveal]||a[1];return `<h3>${z[0]}</h3><p>${z[1]}</p><div class="callout"><div class="label2">玩家可能形成的感受</div>${z[2]}</div>`}
function updateReveal(){const e=document.getElementById('revealResult');if(e)e.innerHTML=renderReveal()}
function soundLab(l){return `<div class="card"><div class="eyebrow">SOUND ATMOSPHERE LAB</div><h2 style="margin:8px 0">在“安静”发生之前，玩家听到过什么？</h2><p class="muted">选择三种声音策略观察其对悬念的意义。示意声形不是项目现有音频，也不直接用于游戏。</p><div class="pillrow" id="soundButtons">${[['fade','风声逐渐减弱'],['cut','稳定后突然消失'],['silent','从头完全安静']].map(([k,t])=>`<button class="pill ${model.sound===k?'active':''}" onclick="model.sound='${k}';draw()">${t}</button>`).join('')}</div><div style="height:18px"></div><svg width="100%" viewBox="0 0 780 180" role="img" aria-label="声音强度随时间变化的概念曲线"><rect width="780" height="180" rx="10" fill="#182b37"/><path d="M35 20 V145 H747" stroke="#668193" fill="none" stroke-width="2"/><path d="M35 59 H747 M35 100 H747" stroke="#496477" stroke-dasharray="4 7"/><path d="${model.sound==='fade'?'M45 44 C180 48 240 65 345 77 S560 112 725 139':model.sound==='cut'?'M45 50 L455 50 L456 142 L725 142':'M45 140 L725 140'}" fill="none" stroke="#e4c18c" stroke-width="4" stroke-linecap="round"/><text x="48" y="169" fill="#9cb6c5" font-size="13">山路开始</text><text x="622" y="169" fill="#9cb6c5" font-size="13">靠近墓口</text><text x="50" y="32" fill="#9cb6c5" font-size="12">声音强度（示意）</text></svg><div class="callout" style="margin-top:16px">${model.sound==='fade'?'让玩家逐渐察觉风声正在减少。如果前面的山路声音常态清楚，缓慢变化可以不动声色地制造不对劲。':model.sound==='cut'?'突然静音会形成清楚的断裂；但如果没有能够解释这种断裂的环境迹象，也可能显得像音频故障。':'从头完全静音可以表现荒凉，却很难让玩家“察觉原有环境规律消失”，除非画面或角色已经建立另一类预期。'}</div><div class="buttonRow" style="margin-top:15px">${btn('重看跑马梁制作记录',`openSource('github_pl')`,'small')}${btn('练习：写下你希望玩家意识到哪件事',`gotoLesson('${l.id}','cases')`,'small')}</div></div>`}
function engineLab(l){return `<div class="card"><div class="eyebrow">DRAMATIC ENGINE COMPARISON</div><h2 style="margin:8px 0">同一事实，三种演法的取舍</h2><p>不要把这一小节当成让AI自动编排的模板。你要观察的是：换一个戏剧动力，玩家究竟在期待什么？</p><div class="stack">${l.patterns.map((x,i)=>`<button class="radioOption ${model.compareMethod===String(i)||model.compareMethod==='pressure'&&i===1?'chosen':''}" onclick="model.compareMethod='${i}';showEngineCompare(${i})"><span class="radioMark">${'ABC'[i]}</span><span>${esc(x)}</span></button>`).join('')}</div><div class="experimentReadout" id="engineCompareResult"><div class="label2">对照思考</div>${esc(l.decision)}</div><div class="card subtle" style="margin-top:16px"><div class="label2">原本创作不必变更</div>${esc(l.own.detail)}</div></div>`}
function showEngineCompare(i){const l=LESSONS[CURRENT];document.querySelectorAll('.radioOption').forEach((b,j)=>b.classList.toggle('chosen',j===i));document.getElementById('engineCompareResult').innerHTML=`<div class="label2">导演判断 · 方案${'ABC'[i]}</div><p>${i===1?'这一方案通常最符合本节课程预设的制作目标。注意检查它是否与正典事实、资源和玩家注意力匹配。':'这项方案并非绝对禁止，但它可能把注意力从本课想表达的关系、代价或行动转移到另一件事。对照看看是否有充分理由保留。'}</p><p class="muted small">${esc(l.decision)}</p>`}
function emergency(){return `<div class="eyebrow">PRODUCTION TROUBLESHOOTING</div><h1>创作卡住时，直接找问题</h1><p class="muted">下面每张卡片对应一个常见制作卡点。点击后获取优先判断和对应课程，不要求从头学。</p><div class="diagnoseGrid">${ISSUES.map((x,i)=>`<button class="diagBtn ${ISSUE===i?'active':''}" onclick="setIssue(${i})"><strong>▸ ${esc(x.n)}</strong><span>${esc(x.d)}</span></button>`).join('')}</div>${ISSUE!==null?`<div class="card goldborder" style="margin-top:18px"><div class="eyebrow">建议先看第${ISSUES[ISSUE].id}节</div><h2>${esc(LESSONS[nlesson(ISSUES[ISSUE].id)].name)}</h2><p>${esc(LESSONS[nlesson(ISSUES[ISSUE].id)].decision)}</p>${btn('直接学习这一节 →',`gotoLesson('${ISSUES[ISSUE].id}')`,'primary')}${btn('看这节的模拟实验',`gotoLesson('${ISSUES[ISSUE].id}','lab')`,'small')}</div>`:''}${foot()}`}
function setIssue(i){ISSUE=i;draw();document.querySelector('.card.goldborder')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
function labPage(){return `<div class="eyebrow">EXPERIMENTAL LAB</div><h1>导演互动实验室</h1><p class="muted">将抽象概念转成可比较的画面、时间、声音和信息变化。实验数据不会写回GameDraft。</p><div class="stack"><div class="featureCard"><h3>01　人物走位与机位</h3><p class="muted small">用后巷精调发活戏作沙盘，切换镜头中心、缩放和演出阶段。</p>${btn('打开互动沙盘',"gotoLesson('05','lab')",'primary')}</div><div class="featureCard"><h3>02　停顿与戏剧节奏</h3><p class="muted small">对照数钱前0.2–3.4秒的等待，并实际播放一段时间预览。</p>${btn('打开停顿实验',"gotoLesson('07','lab')",'primary')}</div><div class="featureCard"><h3>03　环境声音与恐怖</h3><p class="muted small">比较风声减弱、骤停和从头静默的注意力差异。</p>${btn('打开声音实验',"gotoLesson('08','lab')",'primary')}</div><div class="featureCard"><h3>04　阿秀信息深度</h3><p class="muted small">同样的山口结局，玩家知道不同深度的事实，情感目标可能如何变化。</p>${btn('打开信息实验',"gotoLesson('11','lab')",'primary')}</div><div class="featureCard"><h3>05　十种戏剧动力</h3><p class="muted small">把“反差”之外的目标对抗、压力、等待、关系与规则施压等方法摆到同一张参考图上。</p>${btn('打开方法14–23',"gotoLesson('14','lab')",'primary')}</div></div>${foot()}`}
function mistakes(){const rows=[];for(const l of LESSONS)for(let i=0;i<l.questions.length;i++){const q=l.questions[i],key=l.id+'_'+i,attempt=P.attempts[key]||[];if(attempt.some(x=>x!==q.correct))rows.push({l,i,q,attempt,last:P.answers[key]})}return `<div class="eyebrow">REVIEW BOOK</div><h1>错题复习</h1><p class="muted">这里只收录曾经答错的题，即使后来改对也会保留。重点复盘当时缺少了哪个判断维度，而不是为了获得满分机械重刷。</p>${rows.length?rows.map(r=>`<div class="card" style="margin-bottom:12px"><div class="flex between wrap g8">${badge(r.l.id+' · '+r.l.name)}${badge(r.last===r.q.correct?'现已改对':'当前仍未选对',r.last===r.q.correct?'ok':'')}</div><h3 style="margin-top:11px">${esc(r.q.prompt)}</h3><p class="small">${esc(r.q.options[r.q.correct])}</p><div class="callout">${esc(r.q.why)}</div><div style="margin-top:12px">${btn('回到题目',`gotoQuestion('${r.l.id}',${r.i})`,'small')}</div></div>`).join(''):'<div class="card"><h3>还没有错题</h3><p class="muted">完成课程中的情境测试后，曾经答错的题会自动收录到这里。</p></div>'}${foot()}`}
function notes(){const filled=LESSONS.filter(l=>(P.notes[l.id]||'').trim());return `<div class="eyebrow">PRIVATE WORKBOOK</div><h1>学习笔记</h1><p class="muted">你写下的内容只存储在当前浏览器。可导出为Markdown，整理到自己的制作笔记中；本课程不会调用GitHub修改项目。</p><div class="buttonRow">${btn('导出Markdown笔记',"downloadNotes()",'primary')}${btn('导出完整进度JSON',"backup()")}${btn('导入进度JSON',"document.getElementById('importFile').click()")}</div><section class="sectionHead"><h2>已有笔记 · ${filled.length}节</h2></section>${filled.length?filled.map(l=>`<div class="card" style="margin-bottom:12px"><div class="flex between"><h3>${l.id} · ${esc(l.name)}</h3>${btn('查看课程',`gotoLesson('${l.id}','cases')`,'small')}</div><p style="white-space:pre-wrap">${esc(P.notes[l.id])}</p></div>`).join(''):'<div class="card"><p class="muted">还没有保存的练习笔记。每节的“双案例”页面都可填写练习，输入时自动保存。</p></div>'}${foot()}`}
function srcLine(key){const s=SOURCES[key];if(!s)return '';return `<div class="sourceLink"><div><a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.label)} ↗</a><div class="sourceTag">${esc(s.type)}</div></div><span class="dim small">外部链接</span></div>`}
function resources(){return `<div class="eyebrow">REFERENCE SHELF</div><h1>资料与实际工程证据</h1><p class="muted">课程正文可完全离线学习。下面的外部链接只用于继续精读、核对专业概念和检查真实仓库版本；打开链接时需要网络访问。</p><div class="twoCols"><div class="card"><h2>专业课程与书籍</h2>${['pixar','scriptnotes','toolbox','gdc','filmgram','mckee','branching','storyboard','storyreel'].map(srcLine).join('')}</div><div class="card"><h2>《寻狗记》项目资料</h2>${['github_cut','github_gr','github_pl','github_ax'].map(srcLine).join('')}<div class="panel" style="margin-top:15px"><div class="label2">证据边界</div><p class="small">在课程中，“已落地Cutscene”表示仓库有演出数据；“实际已接线”表示有游戏触发路径；“已经验收”依制作记录标记；“设计稿”不冒充可玩完成内容。</p></div></div></div>${foot()}`}
function capstone(){const c=P.capstone;const inp=(k,title,type='area')=>`<div><label class="controlLabel">${title}</label>${type==='area'?`<textarea class="noteArea" data-cap="${k}" rows="3">${esc(c[k]||'')}</textarea>`:`<input class="input" data-cap="${k}" value="${esc(c[k]||'')}"/>`}</div>`;return `<div class="eyebrow">FINAL DIRECTOR'S WORKSHOP</div><h1>最终实战：做一份能交给制作团队的导演决策卡</h1><p class="muted">练习对象：跑马梁到墓候更。目前这段有状态节点与空Cutscene，尚未完成具体表演。你只做方案推敲，不会修改正典或仓库。</p><div class="twoCols"><div class="stack"><div class="card"><h3>① 冻结不能改动的事实</h3>${inp('fact','本段确定发生什么？')}<div class="small muted">避免为解决镜头问题，顺手补出新鬼怪身份或未经批准的阴谋。</div></div><div class="card"><h3>② 定义玩家应该经历什么</h3>${inp('feeling','希望玩家产生的观察、疑问或行动，而非必须产生的情绪')}<div class="controlGrid"><div><label class="controlLabel">主戏剧动力</label><select data-cap="method1" class="select">${['悬念与等待','目标对抗','压力递增','代价选择','关系牵挂','行动暴露','重复积累','信息差','因果回响','规则施压'].map(s=>`<option ${c.method1===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label class="controlLabel">辅助表达方法</label><select data-cap="method2" class="select">${['声音、静默与恐怖导演','镜头与空间焦点','人物动作表演','玩家自主操作','道具与环境证据','对白与潜台词','不使用辅助方法'].map(s=>`<option ${c.method2===s?'selected':''}>${s}</option>`).join('')}</select></div></div></div><div class="card"><h3>③ 可观察的演出方案</h3>${inp('visual','镜头与画面首先应该看见什么？')}${inp('audio','声音、停顿和环境规律怎样变化？')}${inp('action','角色与玩家具体做什么？')}</div><div class="card"><h3>④ 验收问题</h3>${inp('test','给盲测玩家的中性检查问题')}${btn('复制导演方案Markdown',"copyText(buildCapMarkdown())",'primary')}${btn('导出为Markdown文件',"downloadCapstone()",'small')}</div></div><aside class="stack"><div class="card paper" style="position:sticky;top:85px"><div class="eyebrow">LIVE DESIGN CARD</div><h3 style="margin-top:10px">方案实时预览</h3><div id="capPreview">${renderCapPreview()}</div><div class="divider"></div><h4>验收四个维度</h4><div class="small muted">① 玩家注意力正确吗？<br/>② 事实和知识边界守住了吗？<br/>③ 体验靠画面、声音或操作真正发生了吗？<br/>④ 如果效果不佳，首先要修改哪个局部变量？</div></div></aside></div>${foot()}`}
function renderCapPreview(){const c=P.capstone;return `<div class="stack"><div><div class="label2">已知事实</div><div class="small">${esc(c.fact||'（待写）')}</div></div><div><div class="label2">目标体验</div><div class="small">${esc(c.feeling||'（待写）')}</div></div><div class="pillrow">${badge(c.method1,'hit')}${badge(c.method2)}</div><div><div class="label2">画面焦点</div><div class="small">${esc(c.visual||'（待写）')}</div></div><div><div class="label2">声音节奏</div><div class="small">${esc(c.audio||'（待写）')}</div></div><div><div class="label2">玩家/角色行动</div><div class="small">${esc(c.action||'（待写）')}</div></div><div><div class="label2">验收</div><div class="small">${esc(c.test||'（待写）')}</div></div></div>`}
function buildCapMarkdown(){const c=P.capstone;return `# 《寻狗记》到墓候更·导演方案\n\n## 事实边界\n${c.fact}\n\n## 玩家体验目标\n${c.feeling}\n\n## 方法选择\n主：${c.method1}\n辅：${c.method2}\n\n## 画面焦点\n${c.visual}\n\n## 声音与节奏\n${c.audio}\n\n## 行为与互动\n${c.action}\n\n## 盲测验收问题\n${c.test}\n\n> 概念练习，未自动修改仓库或成为正典。`}
function bindGenerated(){GO.querySelectorAll('textarea[data-note]').forEach(el=>el.addEventListener('input',()=>{P.notes[el.dataset.note]=el.value;save()}));GO.querySelectorAll('[data-cap]').forEach(el=>el.addEventListener('input',()=>{P.capstone[el.dataset.cap]=el.value;save();const p=document.getElementById('capPreview');if(p)p.innerHTML=renderCapPreview()}));GO.querySelectorAll('[data-cap]').forEach(el=>el.addEventListener('change',()=>{P.capstone[el.dataset.cap]=el.value;save();const p=document.getElementById('capPreview');if(p)p.innerHTML=renderCapPreview()}))}
function gotoQuestion(id,i){P.qstep[id]=i;gotoLesson(id,'quiz')}
function setQuestion(id,i){P.qstep[id]=Math.max(0,Math.min(3,i));save();draw()}
function selectAnswer(id,i,j){const key=id+'_'+i,q=LESSONS[nlesson(id)].questions[i];P.answers[key]=j;const h=P.attempts[key]||[];h.push(j);P.attempts[key]=h.slice(-12);save();draw()}
function copyNote(id){const l=LESSONS[nlesson(id)];copyText(`# ${l.id} ${l.name}\n练习：${l.task}\n\n${P.notes[id]||'（尚无记录）'}`)}
function copyText(value){const ok=()=>toast('已复制到剪贴板');const fallback=()=>{const a=document.createElement('textarea');a.value=value;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('复制失败，请使用导出功能')}a.remove()};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(value).then(ok).catch(fallback);else fallback()}
function download(filename,value,mime){const b=new Blob([value],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('文件已导出')}
function downloadNotes(){const s=`# 《寻狗记》创作与导演课程笔记\n\n`+LESSONS.map(l=>P.notes[l.id]?`## ${l.id} ${l.name}\n\n${P.notes[l.id]}\n\n`:'').join('');download('寻狗记-创作课程笔记.md',s,'text/markdown;charset=utf-8')}
function downloadCapstone(){download('寻狗记-到墓候更导演方案.md',buildCapMarkdown(),'text/markdown;charset=utf-8')}
function backup(){download('寻狗记-课程进度备份.json',JSON.stringify({format:'xungou-course-v1',saved_at:new Date().toISOString(),progress:P},null,2),'application/json;charset=utf-8')}
function openSource(key){const s=SOURCES[key];if(s)window.open(s.url,'_blank','noopener,noreferrer')}
function importBackup(e){const f=e.target.files?.[0];if(!f)return;f.text().then(t=>{const x=JSON.parse(t);if(x.format!=='xungou-course-v1'||!x.progress||typeof x.progress.answers!=='object')throw new Error('备份格式不匹配');if(!confirm('导入将覆盖当前答题进度和笔记。确定继续？'))return;const p=x.progress;P={...defaultProgress(),...p,answers:{...p.answers},attempts:{...(p.attempts||{})},notes:{...(p.notes||{})},capstone:{...defaultProgress().capstone,...p.capstone}};save();draw();toast('进度已导入')}).catch(err=>toast('导入失败：'+err.message));e.target.value=''}
// Events
window.addEventListener('hashchange',handleHash);
document.getElementById('sideSearch').addEventListener('input',e=>{SEARCH=e.target.value;updateSide()});
document.getElementById('btnMobileMenu').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('open')});
document.getElementById('overlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open')});
document.getElementById('btnSideHome').addEventListener('click',()=>route('#home'));
document.getElementById('btnSideEmergency').addEventListener('click',()=>route('#emergency'));
document.getElementById('btnSideNotes').addEventListener('click',()=>route('#notes'));
document.getElementById('btnSideMistakes').addEventListener('click',()=>route('#mistakes'));
document.getElementById('btnTheme').addEventListener('click',()=>{P.theme=P.theme==='dark'?'light':'dark';save();draw()});
document.getElementById('btnSave').addEventListener('click',backup);
document.getElementById('importFile').addEventListener('change',importBackup);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('sideSearch').focus();document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('open')}});
if(!location.hash)location.replace('#home');else handleHash();
</script>
</body>
</html>

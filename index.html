  modules: [
    {id:'01',title:'对照、突转与发现：先分清讨论对象',level:'文献对照＋编辑勘误',refs:['poetics'],old:'“反差之后：不一致性的结构学”；“列出两个互相抵触却都能成立的命题”。',issue:'标题把课程自拟分类包装成像现成学科的术语；也没有说明两个判断如何在不同主体、时点或尺度下成立。',text:['《诗学》第 XI 节区分行动转向相反结果的突转与由无知到知的发现；这是该著作的概念背景，不是现代所有“反转”的唯一含义。','课程可以自行用“对照”比较言行、期待与结果，但应标为工作性分类。例如角色说自己不怕而手在发抖，并不要求两条互相否定的事实同时为真。','练习建议：先标出谁相信什么，再比较信息改变与处境改变是否同时发生。两者可以独立，不应把“有认知变化”直接评为“有情节突转”。'],boundary:'原《寄生虫》案例没有逐场证据，本版不再拿它给自拟分类背书。'},
    {id:'02',title:'信息分配不等于情绪输出',level:'文献对照＋编辑勘误',refs:['focus'],old:'按观众知道更多、更少、各一半划分，并为每档指定预期效果。',issue:'把知识数量、叙述视点、人物判断与观众感受压进同一个滑杆。',text:['信息选择与人物体验的视点需要分开描述：只报告一个人已经知道的事实，不代表读者就被放在他的感受和评价之中。','本课把“观众知道人物误解了一个关键事实，因此同一言行获得另一层意味”作为分析戏剧性反讽的工作描述；引用的聚焦论只支持信息分配部分，不为这个完整描述提供唯一权威定义。','设计时列具体命题，例如“信确已送达”“收信人已经知情”，而不是计算笼统的知识百分比。观众知道无关事实更多，也未必改变此刻台词的含义。'],boundary:'不保证观众知道越多越紧张。原《俄狄浦斯王》整场解读尚未逐行核对，停止当作完成的作品细读。'},
    {id:'03',title:'误认、不可靠叙述与公平推理不是一回事',level:'文献对照＋编辑勘误',refs:['unreliable'],old:'“隐藏关键规则、只允许作者知道答案，是不公平的推理装置”；纠偏要“使旧解释局部成立”。',issue:'将一种公平解谜的设计目标推广到所有悬疑，又把保留旧解释设成强制条件。',text:['人物的错误信念、叙述者的不可靠报告、对事实的错误解释和价值评价，应分别说明，不能统称一个机制。','如果作品承诺观众能凭已有材料推出答案，就需要检查线索与规则是否兑现这项承诺。这是本课提出的体裁约定检查，不是所有谜团叙事的禁令。','后来可以彻底否定先前假说；需核查的是是否在既有事实与叙述约定下说得通，而非旧假说必须保住一部分。'],boundary:'“人物其实在保护他”应按具体证据判断，不能因形式像翻案就一律判错。'},
    {id:'04',title:'悬念：把未知结果模型与重看悖论放在一起',level:'文献对照＋编辑勘误',refs:['suspense'],old:'好奇仅被概括为过去发生了什么；“每一轮等待必须改变至少一种证据、风险或可行动作”。',issue:'把便于入门的时间分类和节奏练习写成完整解释及必要条件。',text:['不知道结局是一种常用的悬念条件，但“知道结局后仍感觉悬念”有专门争论。Smuts 比较了想象中的不确定、愿望受阻、暂时遗忘与情绪误认等解释，并指出问题。','因此不能把提前揭晓或反复观看直接判为失效，也不能宣称一个信息时间表必然带来指定情绪。下方演示只核对每一拍确实提供了哪些证据。','“每轮增加一个变化”可作为改写练习，不是悬念的定义。等待、表演、声音、期待与观看条件需要共同评估；“好奇”这个普通词也不限于追查过去。'],boundary:'演示是课程新写的微场景，不是希区柯克片段复原，也不使用《寻狗记》正典。'},
    {id:'05',title:'多主体冲突：博弈只是可选分析框架',level:'编辑勘误；未完成原典核验',refs:[],old:'“各方在自己知识范围内采取合理策略”；“任何时候都可以轻易妥协”就没有戏。',issue:'容易把可解释动机偷换成理性优化，并忽略关系、羞耻、习惯和拒绝妥协本身。',text:['作为本课的分析建议，可以记录各方目的、误判与所承担的成本；这不要求角色理性，也不要求冲突双方具有同等道德正当性。','“有可行的妥协”不等于戏消失：当事人不愿、不信或不能接受它，本身可以是需要书写的部分。需要解释的是具体限制，而不是替他们优化决定。'],boundary:'原 Schelling 书目和《一次别离》案例未建立逐项证据，暂不作为本节论据。'},
    {id:'06',title:'升级：不要只剩“策略集合缩小”',level:'编辑勘误；未完成原典核验',refs:[],old:'压力升级的“本质”是可行策略集合变小；最后一轮要从如何完成变成该不该完成。',issue:'把可选模型说成穷尽性的定义，又把道德困境设为固定终点。',text:['“失去退路”可用来设计一种升级，但风险的迫近、关系变化、理解加深或执行难度改变也可能有用。本版将这些列为待比较的设计可能，不宣称统一公式。','新的工具和选择也可能增加压力，例如突然必须决定谁能先走。因此策略数量既不是情绪强度的刻度，也不要求结尾一定变成道德选择。'],boundary:'原《绝命毒师》的概括没有指定集数、场次与因果链，停止作为已分析案例。'},
    {id:'07',title:'不可兼得只是悲剧构造的一条路径',level:'编辑勘误；未完成案例核验',refs:['poetics'],old:'把两种价值不能兼得作为选择的深度，又要求展示曾存在的第三条道路。',issue:'将某类困境训练暗示为悲剧的必要结构。',text:['价值冲突是可选训练，不是悲剧必须具备的双选项结构。第三条道路可以从未存在，也可以仍然存在但未被采取；需要按作品自己的因果来分析。','《诗学》讨论突转、发现与苦难场面，本版仅用它说明另一套具体历史框架。它不能替课程证明“两难必然更深刻”，更不能裁定所有现代悲剧。'],boundary:'“普通生活照常”是否构成悲剧，应结合你的具体作品讨论，不能由系统打勾认定。'},
    {id:'08',title:'重复频率与“三次法”分开',level:'文献对照＋编辑勘误',refs:['time'],old:'“第二次确认规则，第三次的小偏移才产生超额意义”。',issue:'把一个常用练习节式写成必经顺序。',text:['叙事学中的频率讨论事件发生多少次、被叙述多少次；它不规定第三次必须变化。一次发生被反复讲述，与多次发生被概括讲述，是不同问题。','“建立—重复—变奏”可以作为本课自拟的练习约束；也可以在第二次就变化，或始终不变。是否成立要看观众是否能比较、变化有何作用，而不是数到三。'],boundary:'原《土拨鼠之日》概述不构成“三次法”的证据；整片逐段分析暂未完成。'},
    {id:'09',title:'重读旧事件：先分清改变了哪一层',level:'文献对照＋编辑勘误',refs:['unreliable'],old:'“再语境化”必须改变解释而不修改物理过程；旧事件不能被彻底推翻。',issue:'把课程自选的“保留事实改意义”练习推广为作品规则。',text:['本课可以固定同一事件，研究新语境如何改变解释；这只是受控练习的限制。叙述也可能后来纠正先前不可靠的报告，不能一律按“篡改事实”处理。','分别标记作品世界中的发生、人物所信、叙述所报告与观众所推断。再问后文到底修正了哪一层，不要先把所有早期画面当成无条件客观事实。'],boundary:'原《星际穿越》没有场次、版本或画面证据，本版撤下它作为已核验的例证。'},
    {id:'10',title:'日常段落的价值：不能只用事件强度衡量',level:'文献对照＋编辑勘误',refs:['tell'],old:'“低烈度戏”的表述列出共同时间、生活纹理等价值。',issue:'方向可以讨论，但分类由课程自拟；没有具体观看条件就不足以教人做出有效场景。',text:['Baroni 讨论值得讲述的程度与呈现方式、语境、听者及体裁的关系；这提醒我们不能仅按事件是否惊险衡量价值。','本课将“没有显性冲突的共同活动”作为练习对象，但不保证任何杂活都值得保留。请写出一个具体可观察的相处差异，并比较删掉或延长这段后，体验改变了什么。'],boundary:'不能反向立规矩：有伏笔、有情节作用的日常段落并不因此低级。原电影案例仍待逐场核验。'},
    {id:'11',title:'悲喜并置：不把一种偏好变成等级',level:'编辑勘误；未完成原典核验',refs:[],old:'同一行为兼有悲喜被称为“更高级”；情绪转换被预先指定。',issue:'没有证据给不同手法排审美等级，三个选项也不能替代节奏与表演的推演。',text:['本课可以比较同一行为的双重意味与前后转调，两种都只是策略；不能凭形式判定高低。','必须说明观众在哪一刻获得哪条信息、正在看到哪个动作，以及哪一处变化可能影响观看。效果只写为假说，不再由选项预填“先笑后疼”。'],boundary:'原《美丽人生》《城市之光》分析没有逐场证据，暂不作为已核验讲义。'},
    {id:'12',title:'空间、注意力与社会权力不能混用',level:'编辑勘误；未完成原典核验',refs:[],old:'镜头中心、社会权力中心与行动资源中心被并列成可操作模型。',issue:'可以用作分项观察，却不应暗示它们必然共同迁移或由某类站位唯一表达。',text:['先分开“看到了谁”“谁能决定后续行动”“谁被他人承认”。三者可以分离，人物离开画面也不等于失去权力。','本节自拟训练是用同一段话测试两组走位，并记录实际先看见的动作。未给出角色相对位置、视角和动作顺序时，不算完成调度分析。'],boundary:'原《十二怒汉》整片概括撤出论证；需要指定场次再进行镜头层面的细读。'},
    {id:'13',title:'玩家能动性：先验证可做之事与可感后果',level:'编辑勘误；未完成原典核验',refs:[],old:'玩家、角色、规则的三层能动性，以及有意义选择的宽泛说明。',issue:'分类可作工作笔记，但不能冒充从 Murray 直接推导出的既定模型。',text:['这里的三栏是课程自拟的设计检查：玩家想做什么、角色在虚构中想做什么、规则允许什么。三者的关系要落实为具体操作与反馈。','结局固定的作品不自动缺乏能动性；有多个结局也不自动令选择有意义。应具体展示行动如何影响体验，不用“选项数量”替代分析。'],boundary:'《请出示文件》及 Murray 的书目没有逐段对应核查，本节暂不将其列为支持这套三栏模型的证据。'},
    {id:'14',title:'叙事合流：保存哪些差异需要明示',level:'文献对照＋编辑推导',refs:['storylets','branch'],old:'不同历史可以折叠；少量记忆状态维持因果密度。',issue:'可行的设计方向，不等于任意历史都能靠一句话无损合流；旧稿没有定义保留的观察范围。',text:['Short 描述 storylet 的内容、前提与状态效果；Ashwell 讨论分支与瓶颈。这支持研究合流的组织方式，不保证任意作品都能低成本保存一切意义。','本课提出一个工程检查：在指定的后续场景集合里，比较不同历史是否需要不同可见反应。若需要，则相关区别不能在这组场景之前直接抹掉。这是本课推导，不是来源中的普遍定理。','下面只演示“是否曾损坏并拒赔旧伞”这一位记忆如何影响下一句回应；它不模拟整个人物，也不宣称完成叙事等价判定。'],boundary:'《奥伯拉丁的回归》不是通用状态剪枝算法的证明，原稿不再这样借用它。'},
    {id:'15',title:'组合分析：先有具体方案，后谈交互作用',level:'编辑勘误；未完成原典核验',refs:[],old:'必须有唯一首要体验；辅助机制应作用于另一层；用27种排列表示实验。',issue:'将便于排查问题的减法策略写成多层叙事的普遍限制。',text:['单一焦点可作为排错手段，不是每一场戏的义务。多焦点、同时活动和含混视点都可以成为设计目标。','交互作用需要实际方案支持。例如提前给出一条危险信息后，原有停顿为什么改变意义？若只选了“悬念＋重复”，没有事件、顺序和新旧两版，就没有完成分析。'],boundary:'取消27／432组合数量宣传；未经逐组编写与检验的笛卡尔积不算训练实例。'},
    {id:'16',title:'比较、盲测与因果实验：不要借科学措辞背书',level:'编辑勘误；未完成方法文献核验',refs:[],old:'一项变量变化的A/B被称为“受控比较”，保存两个方案和任意笔记即判完成。',issue:'同一人依次看两个版本会有记忆影响；保存状态更不是学会技法的证据。',text:['在这里写A/B是作品比较，不自动构成随机对照实验。应记录观看顺序、先验知识、参与者与问题；小样本观察不直接支持普遍因果结论。','程序最多检查资料是否齐备，不判断艺术质量。新版分开保存两份具体方案与比较笔记；内容相同或只有空白不能计为齐备，齐备也不等于掌握。'],boundary:'原稿的“GDC相关讲座”没有确定讲者、标题与段落，已撤下这条无定位书目。'}
  ]
};

 let text=diffs.length?'参数差异：'+diffs.map(k=>labels[k]).join('、'):'两个方案的参数相同。';if(current.engine==='risk'&&JSON.stringify(s.A.trace)!==JSON.stringify(s.B.trace))text+=' 操作轨迹不同。';if(current.engine==='pass'&&s.A.choice!==s.B.choice)text+=' 保存的路径选择不同。';
 if(current.engine==='evidence'){const ka=s.A.config.seen.slice().sort().join(','),kb=s.B.config.seen.slice().sort().join(',');text+=ka===kb?' 已见材料集合相同；可以继续比较发现顺序。':' 已见材料集合不同。';text+=' 两版物件的世界事实不变。'}
 $('#compareContent').innerHTML=`<p class="small muted">${esc(text)} 不按参数多少判定戏好坏。</p><div class="two compareGrid">${['A','B'].map(k=>`<section class="abPreview"><div class="row between"><h3>方案 ${k}</h3>${btn('载入这版','loadShot:'+k)}</div><div class="stageView" id="compareSvg${k}"></div><div class="subtitles"><span class="speaker" id="compareTitle${k}"></span><span class="subline" id="compareText${k}"></span></div><p class="small muted" style="white-space:pre-wrap">${esc(s[k].note||'保存时未填写方案说明。')}</p></section>`).join('')}</div>${current.engine!=='evidence'?`<div class="row compareTime"><button data-action="comparePlay" id="comparePlay" class="primary">▶ 同步回放</button><input id="compareSeek" class="seek" style="flex:1;width:auto;min-width:100px" type="range" min="0" max="1000" value="0" aria-label="A/B共同时间轴"><span class="mono small" id="compareTimeLabel"></span></div><p class="small muted">两侧按同一经过时间播放；短版到结尾停住，不自动拉伸成同一时长。</p>`:''}`;
 $('#compareDialog').showModal();drawCompare();
}
function drawCompare(){if(!current||!$('#compareDialog').open)return;const s=entry(current).shots;for(const k of ['A','B']){const a=renderShot(current,s[k],Math.min(compareClock,compareTotal(current,s[k])));$('#compareSvg'+k).innerHTML=a.svg;$('#compareTitle'+k).textContent=a.title;$('#compareText'+k).textContent=a.text}if($('#compareSeek')){$('#compareSeek').value=String(compareClock/compareMax*1000);$('#compareTimeLabel').textContent=(compareClock/1000).toFixed(1)+' / '+(compareMax/1000).toFixed(1)+'s';$('#comparePlay').textContent=comparePlaying?'Ⅱ 暂停':'▶ 同步回放'}if(compareClock>=compareMax)comparePlaying=false}
function closeMenu(){$('#sidebar').classList.remove('open');$('#shade').hidden=true;$('#menu').setAttribute('aria-expanded','false')}
function goTab(t){route('#lesson/'+current.id+'/'+t)}
function updateParam(el){if(!current)return;const c=config(),k=el.dataset.param;if(!(k in c))return;let v=el.type==='checkbox'?el.checked:(typeof c[k]==='number'?Number(el.value):el.value);const candidate={...c,[k]:v};try{entry(current).config=validateConfig(candidate,current)}catch(e){toast(e.message);return}const now=config();const out=$('[data-value="'+k+'"]');if(out)out.textContent=String(now[k])+(el.dataset.suffix||'');if(k==='sound'){if(now.sound)audioStart();else audioStop()}
 if(k==='torch'&&risk){logRisk(now.torch?'重新点火，普通侵扰退去；已损失阳气不恢复。':'熄火。是否受损还取决于遭遇范围。');risk.trace.push([+risk.elapsed.toFixed(3),risk.x,risk.y,risk.health,now.torch?1:0])}
 if(current.engine==='stage'){const total=defaultTimeline(current,now).at(-1).end;clock=Math.min(clock,total);if(k==='order'||k==='ellipsis'){clock=0;playing=false;beats()}}
 if(current.engine==='evidence'&&k==='lens'){playing=false}
 save();drawEngine();
}
document.addEventListener('click',e=>{
 const r=e.target.closest('[data-route]');if(r){route(r.dataset.route);return}
 const b=e.target.closest('[data-beat]');if(b&&current?.engine==='stage'){playing=false;clock=defaultTimeline(current,config()).find(x=>x.index===Number(b.dataset.beat))?.start||0;drawStage();return}
 const preview=e.target.closest('[data-preview]');if(preview){const i=Number(preview.dataset.preview);goTab('lab');setTimeout(()=>{if(current?.engine==='stage'){clock=defaultTimeline(current,config()).find(x=>x.index===i)?.start||0;drawStage()}},80);return}
 const clue=e.target.closest('[data-clue]');if(clue&&current?.engine==='evidence'&&!$('#compareDialog').open){const k=clue.dataset.clue,c=config();if(!D.clues.find(x=>x.id===k))return;c.seen=c.seen.includes(k)?c.seen.filter(x=>x!==k):[...c.seen,k];save();drawEvidence();const target=$('#clueButtons [data-clue="'+k+'"]');target?.focus({preventScroll:true});return}
 const jump=e.target.closest('[data-jump]');if(jump&&current?.engine==='history'){clock=config().historyOrder.indexOf(Number(jump.dataset.jump))*config().hold*1000;playing=false;drawHistory();return}
 const move=e.target.closest('[data-move]');if(move&&current?.engine==='history'){const[i,d]=move.dataset.move.split(':').map(Number),a=config().historyOrder,j=i+d;if(j<0||j>6)return;[a[i],a[j]]=[a[j],a[i]];save();historyCards();drawHistory();return}
 const z=e.target.closest('[data-action]');if(!z)return;const[act,v]=z.dataset.action.split(':');if(act==='go'){route('#lesson/'+v+'/lab');return}if(!current)return;
 if(['lab','cases','challenge','learn'].includes(act)){goTab(act);return}if(act==='prev'||act==='next'){const i=clamp(D.lessons.indexOf(current)+(act==='next'?1:-1),0,15);route('#lesson/'+D.lessons[i].id+'/lab');return}
 if(act==='play'){if(current.engine==='risk'&&(risk.dead||risk.exit)){toast('本次试走已结束，请重试或保存。');return}if(current.engine==='stage'&&clock>=defaultTimeline(current,config()).at(-1).end)clock=0;if(current.engine==='pass'&&!pass?.choice){toast('先选择一条路。');return}playing=!playing;if(current.engine==='risk'&&config().sound)audioStart();drawEngine();return}
 if(act==='restart'){clock=0;playing=true;drawEngine();return}
 if(act==='saveShot'){takeShot(v);return}if(act==='compare'){compareOpen();return}
 if(act==='comparePlay'){if(compareClock>=compareMax)compareClock=0;comparePlaying=!comparePlaying;drawCompare();return}
 if(act==='loadShot'){const s=entry(current).shots[v];if(!s)return;entry(current).config=copy(s.config);$('#compareDialog').close();comparePlaying=false;save();render();clock=s.time;if(current.engine==='risk'&&s.trace?.length){const q=s.trace.at(-1);risk={...newRisk(config()),x:q[1],y:q[2],health:q[3],elapsed:q[0],trace:copy(s.trace),recorded:q[0]};config().torch=!!q[4];const cb=$('[data-param="torch"]');if(cb)cb.checked=config().torch}if(current.engine==='pass'&&s.choice)pass={choice:s.choice,progress:0,elapsed:0};drawEngine();toast('已载入 '+v+'，不会覆盖另一版。');return}
 if(act==='resetConfig'){entry(current).config=cfgDefault(current);save();render();return}
 if(act==='riskReset'){risk=newRisk(config());clock=0;playing=false;drawRisk();return}
 if(act==='step'&&current.engine==='risk'){if(risk.dead||risk.exit)return;risk.keys.add(v);tickRisk(.28);risk.keys.delete(v);drawRisk();return}
 if(act==='clearClues'){config().seen=[];save();drawEvidence();return}if(act==='reverseClues'){config().seen.reverse();save();drawEvidence();return}
 if(act==='sourceOrder'){config().historyOrder=[0,1,2,3,4,5,6];save();historyCards();clock=0;drawHistory();return}
 if(act==='choose'){pass={choice:v,progress:0,elapsed:0};playing=true;clock=0;drawPass();return}if(act==='passReset'){pass={choice:null,progress:0,elapsed:0};playing=false;clock=0;drawPass();return}
});
document.addEventListener('input',e=>{
 const el=e.target;if(el.matches('[data-param]')){updateParam(el);return}
 if(el.matches('[data-note]')&&current){entry(current).notes[el.dataset.note]=el.value;save();return}
 if(el.id==='seek'&&current){playing=false;const total=current.engine==='stage'?defaultTimeline(current,config()).at(-1).end:config().hold*7000;clock=Number(el.value)/1000*total;drawEngine();return}
 if(el.id==='compareSeek'){comparePlaying=false;compareClock=Number(el.value)/1000*compareMax;drawCompare()}
});
document.addEventListener('change',e=>{if(e.target.matches('select[data-param],input[type=checkbox][data-param]'))updateParam(e.target)});
// Pointer motion never rebuilds the control panel: focus and scroll stay stable.
document.addEventListener('pointerdown',e=>{
 const key=e.target.closest('[data-action^="step:"]');if(key&&current?.engine==='risk'&&!risk.dead&&!risk.exit){risk.keys.add(key.dataset.action.split(':')[1]);playing=true;key.setPointerCapture?.(e.pointerId);return}
 const node=e.target.closest('[data-actor]');if(node&&current?.engine==='stage'&&current.preset.drag&&tab==='lab'&&!$('#compareDialog').open){const svg=node.closest('svg'),m=svg.getScreenCTM();if(!m)return;const i=Number(node.dataset.actor);drag={type:'actor',i,x:e.clientX,y:e.clientY,sx:m.a,sy:m.d,base:config().actors[i]||[0,0]};playing=false;$('#stage').setPointerCapture(e.pointerId);e.preventDefault();return}
 if(e.target.closest('[data-pass-drag]')&&current?.engine==='pass'&&!pass.choice){drag={type:'pass',x:e.clientX};$('#passStage').setPointerCapture(e.pointerId)}
});
document.addEventListener('pointermove',e=>{if(!drag||!current)return;if(drag.type==='actor'){const a=config().actors;while(a.length<=drag.i)a.push([0,0]);a[drag.i]=[clamp(drag.base[0]+(e.clientX-drag.x)/drag.sx/9,-60,60),clamp(drag.base[1]+(e.clientY-drag.y)/drag.sy/4.1,-60,60)];drawStage()}else if(drag.type==='pass'){const d=e.clientX-drag.x;if(Math.abs(d)>24){pass={choice:d<0?'go':'back',progress:0,elapsed:0};playing=true;drag=null;drawPass()}}});
document.addEventListener('pointerup',()=>{if(drag?.type==='actor')save();drag=null;risk?.keys.clear()});document.addEventListener('pointercancel',()=>{drag=null;risk?.keys.clear()});
let draggingEvent=null;document.addEventListener('dragstart',e=>{const n=e.target.closest('[data-event]');if(n){draggingEvent=Number(n.dataset.event);e.dataTransfer.setData('text/plain',String(draggingEvent));e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-event]'))e.preventDefault()});document.addEventListener('drop',e=>{const n=e.target.closest('[data-event]');if(n&&current?.engine==='history'&&draggingEvent!==null){e.preventDefault();const a=config().historyOrder,from=a.indexOf(draggingEvent),to=a.indexOf(Number(n.dataset.event));if(from>=0&&to>=0){a.splice(to,0,a.splice(from,1)[0]);save();historyCards();drawHistory()}draggingEvent=null}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeMenu();comparePlaying=false}
 if(e.target.closest('input,textarea,select,[contenteditable=true]'))return;
 if(e.target.matches('[data-clue]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}
 if(current?.engine==='risk'&&tab==='lab'&&!$('#compareDialog').open){const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){e.preventDefault();if(!risk.dead&&!risk.exit){risk.keys.add(k);playing=true}return}}
 if(e.code==='Space'&&current&&tab==='lab'&&!e.target.closest('button,a')&&!$('#compareDialog').open){e.preventDefault();if(current.engine!=='evidence')playing=!playing}
});document.addEventListener('keyup',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k)risk?.keys.delete(k)});
window.addEventListener('blur',()=>{risk?.keys.clear();playing=false;comparePlaying=false;audioStop()});document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;comparePlaying=false;risk?.keys.clear();audioStop()}});
document.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'&&e.target.open){playing=false;audioStop()}},true);
$('#menu').addEventListener('click',()=>{const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#shade').hidden=!open;$('#menu').setAttribute('aria-expanded',String(open))});$('#shade').addEventListener('click',closeMenu);$('#search').addEventListener('input',drawNav);
$('#theme').addEventListener('click',()=>{P.theme=P.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=P.theme;save()});
$('#closeCompare').addEventListener('click',()=>{$('#compareDialog').close();comparePlaying=false});$('#compareDialog').addEventListener('close',()=>{comparePlaying=false});
function validateLegacyImport(v){const w=v.progress;if(!w||typeof w!=='object'||Array.isArray(w))throw Error('旧版备份缺少有效记录');for(const key of ['notes','legacyNotes','comparison','plans']){if(w[key]!=null){if(typeof w[key]!=='object'||Array.isArray(w[key]))throw Error('旧版记录字段错误：'+key);for(const[k,t]of Object.entries(w[key])){if(!/^\d{2}$/.test(k))throw Error('旧版章节编号错误');if(key==='plans'){if(!t||typeof t!=='object'||Array.isArray(t))throw Error('旧版方案错误');for(const z of Object.values(t))if(typeof z!=='string'||z.length>100000)throw Error('旧版方案文字错误')}else if(typeof t!=='string'||t.length>100000)throw Error('旧版笔记文字错误')}}}}
function download(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#export').addEventListener('click',()=>download({schema:SCHEMA,release:D.release,exportedAt:new Date().toISOString(),progress:P},'xungou-course-progress-v4.json'));
$('#import').addEventListener('click',()=>$('#importFile').click());$('#importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>2097152)throw Error('备份不能超过2MiB');const raw=await f.text(),v=JSON.parse(raw);let next;
 if(v.schema===SCHEMA)next=validate(v.progress);else if(['dramaturgy-review-v3','dramaturgy-advanced-v2'].includes(v.schema)){validateLegacyImport(v);const old=P;P=empty();migrate(raw,v.schema);next=P;P=old;}else throw Error('不支持该备份格式');
 localStorage.setItem(KEY+'-before-import',JSON.stringify(P));P=next;loadIssue='';isolated=false;save();render();toast('导入完成；替换前的新版记录已另存备份，旧版本原键未改动。');
 }catch(err){toast('导入取消：'+err.message+'。当前记录未替换。')}finally{e.target.value=''}});
function animate(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;if(playing&&current&&tab==='lab'){clock+=dt*1000;if(current.engine==='risk')tickRisk(dt);if(current.engine==='pass'&&pass?.choice){pass.elapsed+=dt;pass.progress=clamp((pass.elapsed-config().passHold)/5,0,1);if(pass.progress>=1)playing=false}}
 if(comparePlaying){compareClock=Math.min(compareMax,compareClock+dt*1000)}if(t-renderTime>40){renderTime=t;if(playing||current?.engine==='risk'&&tab==='lab'||current?.engine==='pass'&&tab==='lab')drawEngine();if($('#compareDialog').open)drawCompare();audioUpdate()}frame=requestAnimationFrame(animate)}
window.addEventListener('hashchange',()=>{if($('#compareDialog').open)$('#compareDialog').close();comparePlaying=false;render();window.scrollTo(0,0)});
// Deterministic, read-only inspection points used by local browser regression tests.
window.COURSE_TEST={getState:()=>copy(P),getClock:()=>clock,getRisk:()=>risk?{...copy({...risk,keys:[]})}:null,getLesson:()=>current?.id,validate,stageAt,defaultTimeline,release:D.release};
render();frame=requestAnimationFrame(animate);
})();
</script></body></html>
